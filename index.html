<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>BS Chats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root{
            --primary: #8b5cf6;
            --primary-2: #06b6d4;
            --gradient: linear-gradient(135deg, #8b5cf6 0%, #06b6d4 100%);
            --gradient-soft: linear-gradient(135deg, rgba(139,92,246,0.15) 0%, rgba(6,182,212,0.15) 100%);
            --gradient-glow: linear-gradient(135deg, rgba(139,92,246,0.4) 0%, rgba(6,182,212,0.4) 100%);
            --bg: #0a0a0f;
            --surface: rgba(22, 22, 30, 0.85);
            --surface-solid: #16161e;
            --surface-2: #1f1f2a;
            --surface-3: #2a2a38;
            --text: #f5f5f7;
            --text-secondary: #8b8b9a;
            --text-muted: #5a5a6a;
            --danger: #f43f5e;
            --danger-soft: rgba(244, 63, 94, 0.15);
            --success: #10b981;
            --border: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(139, 92, 246, 0.3);
        }
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-tap-highlight-color:transparent;}
        html,body{height:100%;overscroll-behavior:none;}
        body{
            background:#000;
            color:var(--text);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100dvh;
            overflow:hidden;
            overscroll-behavior-y:contain;
            background-image:
                radial-gradient(circle at 15% 15%, rgba(139,92,246,0.15) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(6,182,212,0.15) 0%, transparent 45%);
        }
        #app-container{
            width:100%;
            max-width:420px;
            height:100dvh;
            max-height:880px;
            background:
                radial-gradient(circle at 20% 0%, rgba(139,92,246,0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 100%, rgba(6,182,212,0.08) 0%, transparent 40%),
                #0f0f16;
            position:relative;
            display:flex;
            flex-direction:column;
            overflow:hidden;
            box-shadow:0 0 60px rgba(139,92,246,0.2), 0 0 100px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.05);
            border-radius:28px;
            border:1px solid rgba(255,255,255,0.08);
        }
        @media(max-width:520px){
            body{background:var(--bg);background-image:none;}
            #app-container{max-width:100%;max-height:100dvh;border-radius:0;border:none;box-shadow:none;height:100dvh;}
        }

        /* ===== HEADER ===== */
        header{
            background:rgba(22,22,30,0.75);
            backdrop-filter:blur(20px) saturate(180%);
            -webkit-backdrop-filter:blur(20px) saturate(180%);
            padding:14px 16px;
            padding-top:max(14px, env(safe-area-inset-top));
            display:flex;align-items:center;justify-content:space-between;
            border-bottom:1px solid var(--border);
            z-index:10;min-height:64px;flex-shrink:0;
            position:relative;
        }
        header::after{
            content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
            background:linear-gradient(90deg, transparent, rgba(139,92,246,0.5), rgba(6,182,212,0.5), transparent);
        }
        header h1{
            font-size:1.25rem;font-weight:800;
            background:var(--gradient);
            -webkit-background-clip:text;background-clip:text;
            -webkit-text-fill-color:transparent;
            letter-spacing:-0.02em;
        }
        .header-actions{display:flex;gap:8px;align-items:center;}
        .icon-btn{
            background:rgba(255,255,255,0.04);
            border:1px solid var(--border);
            color:var(--text);
            font-size:1rem;
            cursor:pointer;
            padding:0;
            width:42px;height:42px;
            display:flex;align-items:center;justify-content:center;
            border-radius:14px;
            transition:all 0.2s cubic-bezier(0.4,0,0.2,1);
        }
        .icon-btn:active{
            background:var(--gradient-soft);
            border-color:var(--border-hover);
            transform:scale(0.94);
        }
        .icon-btn:hover{
            background:rgba(255,255,255,0.08);
            border-color:rgba(139,92,246,0.3);
        }
        .icon-btn.primary-btn{
            background:var(--gradient);
            border:none;
            color:#fff;
            box-shadow:0 4px 12px rgba(139,92,246,0.3);
        }
        .icon-btn.primary-btn:active{box-shadow:0 2px 6px rgba(139,92,246,0.4);}

        /* ===== AVATARS ===== */
        .avatar{
            width:44px;height:44px;border-radius:14px;object-fit:cover;
            background:#000;flex-shrink:0;
            border:1px solid rgba(255,255,255,0.08);
        }
        .avatar-sm{width:38px;height:38px;border-radius:12px;}

        /* ===== MAIN ===== */
        main{flex:1;position:relative;overflow:hidden;min-height:0;}
        .view{
            position:absolute;top:0;left:0;right:0;bottom:0;
            display:none;flex-direction:column;
            overflow-y:auto;
            -webkit-overflow-scrolling:touch;
        }
        .view.active{display:flex;animation:viewIn 0.25s ease;}
        @keyframes viewIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

        /* ===== BOTTOM NAV ===== */
        nav{
            background:rgba(22,22,30,0.85);
            backdrop-filter:blur(20px) saturate(180%);
            -webkit-backdrop-filter:blur(20px) saturate(180%);
            display:flex;justify-content:space-around;
            padding:10px 8px;
            padding-bottom:max(10px, env(safe-area-inset-bottom));
            border-top:1px solid var(--border);
            z-index:10;flex-shrink:0;gap:4px;
        }
        .nav-item{
            display:flex;flex-direction:column;align-items:center;
            color:var(--text-secondary);
            text-decoration:none;font-size:0.68rem;font-weight:600;
            gap:4px;cursor:pointer;position:relative;
            background:none;border:none;
            padding:8px 12px;
            min-height:52px;justify-content:center;
            border-radius:14px;
            transition:all 0.2s cubic-bezier(0.4,0,0.2,1);
            flex:1;letter-spacing:0.02em;
            text-transform:uppercase;
        }
        .nav-item i{font-size:1.05rem;transition:transform 0.2s;}
        .nav-item.active{
            color:#fff;
            background:var(--gradient-soft);
            box-shadow:inset 0 0 0 1px rgba(139,92,246,0.3), 0 0 20px rgba(139,92,246,0.1);
        }
        .nav-item.active i{
            background:var(--gradient);
            -webkit-background-clip:text;background-clip:text;
            -webkit-text-fill-color:transparent;
            transform:translateY(-1px);
        }
        .nav-item:active{transform:scale(0.96);}
        .badge{
            position:absolute;top:2px;right:16%;
            background:var(--gradient);
            color:#fff;
            font-size:0.6rem;font-weight:800;
            padding:2px 7px;border-radius:10px;
            min-width:20px;text-align:center;
            box-shadow:0 2px 8px rgba(139,92,246,0.5);
            letter-spacing:0;
        }

        /* ===== LIST ITEMS ===== */
        .list-item{
            display:flex;align-items:center;
            padding:14px 18px;
            cursor:pointer;
            transition:all 0.2s cubic-bezier(0.4,0,0.2,1);
            min-height:72px;
            margin:4px 12px;
            border-radius:16px;
            border:1px solid transparent;
            position:relative;
        }
        .list-item:active{
            background:var(--gradient-soft);
            border-color:var(--border-hover);
            transform:scale(0.99);
        }
        .list-item:hover{
            background:rgba(255,255,255,0.03);
            border-color:rgba(255,255,255,0.06);
        }
        .list-details{margin-left:14px;flex:1;overflow:hidden;min-width:0;}
        .list-title{
            font-weight:700;font-size:0.95rem;
            display:flex;justify-content:space-between;align-items:center;gap:8px;
            color:var(--text);
            letter-spacing:-0.01em;
        }
        .list-subtitle{
            font-size:0.8rem;color:var(--text-secondary);
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
            margin-top:3px;font-weight:500;
        }
        .status-dot{
            width:9px;height:9px;border-radius:50%;
            display:inline-block;flex-shrink:0;
            border:2px solid var(--surface-solid);
        }
        .status-dot.online{
            background:var(--success);
            box-shadow:0 0 10px rgba(16,185,129,0.6);
        }
        .status-dot.offline{background:var(--text-muted);}

        /* ===== CHAT VIEW ===== */
        #chat-view{z-index:20;background:#0f0f16;}
        .chat-header{
            background:rgba(22,22,30,0.85);
            backdrop-filter:blur(20px) saturate(180%);
            -webkit-backdrop-filter:blur(20px) saturate(180%);
            padding:12px 14px;
            padding-top:max(12px, env(safe-area-inset-top));
            display:flex;align-items:center;gap:12px;
            border-bottom:1px solid var(--border);
            flex-shrink:0;position:relative;
        }
        .chat-header::after{
            content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
            background:linear-gradient(90deg, transparent, rgba(139,92,246,0.4), transparent);
        }
        .chat-messages{
            flex:1;padding:20px 16px;
            overflow-y:auto;
            display:flex;flex-direction:column;gap:12px;
            min-height:0;-webkit-overflow-scrolling:touch;
        }
        .chat-messages::-webkit-scrollbar{width:4px;}
        .chat-messages::-webkit-scrollbar-thumb{background:rgba(139,92,246,0.3);border-radius:2px;}

        .message-bubble{
            max-width:78%;
            padding:10px 14px;
            border-radius:18px;
            font-size:0.9rem;font-weight:500;
            word-wrap:break-word;overflow-wrap:anywhere;
            position:relative;
            animation:msgIn 0.25s cubic-bezier(0.4,0,0.2,1);
            line-height:1.45;
        }
        @keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(0.97);}to{opacity:1;transform:translateY(0) scale(1);}}

        .message-bubble.me{
            align-self:flex-end;
            background:var(--gradient);
            color:#fff;
            border-bottom-right-radius:4px;
            box-shadow:0 4px 16px rgba(139,92,246,0.35);
        }
        .message-bubble.other{
            align-self:flex-start;
            background:var(--surface-2);
            color:var(--text);
            border-bottom-left-radius:4px;
            border:1px solid var(--border);
        }
        .message-time{
            font-size:0.65rem;opacity:0.75;
            text-align:right;margin-top:4px;
            font-weight:600;letter-spacing:0.02em;
        }

        .chat-input-area{
            padding:10px 14px;
            padding-bottom:max(10px, env(safe-area-inset-bottom));
            background:rgba(22,22,30,0.9);
            backdrop-filter:blur(20px);
            -webkit-backdrop-filter:blur(20px);
            display:flex;align-items:center;gap:8px;
            flex-shrink:0;
            border-top:1px solid var(--border);
        }
        .chat-input{
            flex:1;
            background:var(--surface-2);
            border:1px solid var(--border);
            color:var(--text);
            padding:12px 18px;
            border-radius:24px;
            outline:none;
            font-size:16px;min-width:0;
            font-weight:500;
            transition:all 0.2s;
        }
        .chat-input:focus{
            border-color:var(--primary);
            background:rgba(139,92,246,0.05);
            box-shadow:0 0 0 3px rgba(139,92,246,0.15);
        }
        .chat-input::placeholder{color:var(--text-muted);}
        .send-btn{
            width:46px;height:46px;min-width:46px;
            background:var(--gradient);
            border:none;border-radius:50%;
            color:#fff;font-size:1rem;
            display:flex;align-items:center;justify-content:center;
            cursor:pointer;
            box-shadow:0 4px 12px rgba(139,92,246,0.4);
            transition:all 0.2s;
        }
        .send-btn:active{transform:scale(0.9);box-shadow:0 2px 6px rgba(139,92,246,0.5);}

        .typing-indicator{
            font-size:0.72rem;
            font-weight:600;
            color:var(--primary-2);
            font-style:italic;
            height:20px;padding:0 20px;line-height:20px;
            flex-shrink:0;
            letter-spacing:0.01em;
        }

        /* ===== SIDE MENU ===== */
        .side-menu{
            position:absolute;top:0;left:-100%;
            width:82%;max-width:340px;height:100%;
            background:rgba(22,22,30,0.98);
            backdrop-filter:blur(30px);
            -webkit-backdrop-filter:blur(30px);
            z-index:40;
            transition:left 0.32s cubic-bezier(0.4,0,0.2,1);
            padding:24px 20px;
            padding-top:max(24px, env(safe-area-inset-top));
            display:flex;flex-direction:column;
            box-shadow:4px 0 40px rgba(0,0,0,0.7);
            border-right:1px solid var(--border);
        }
        .side-menu.open{left:0;}
        .menu-overlay{
            position:absolute;top:0;left:0;right:0;bottom:0;
            background:rgba(0,0,0,0.65);
            z-index:35;display:none;
            backdrop-filter:blur(4px);
        }
        .menu-overlay.open{display:block;animation:fadeIn 0.2s;}
        @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

        .profile-card{
            text-align:center;margin-bottom:28px;
            padding:24px 16px;
            background:var(--gradient-soft);
            border-radius:20px;
            border:1px solid rgba(139,92,246,0.2);
        }
        .profile-card img{
            width:88px;height:88px;
            margin-bottom:12px;
            border-radius:24px;
            border:2px solid rgba(139,92,246,0.4);
            box-shadow:0 8px 24px rgba(139,92,246,0.3);
        }

        /* ===== MODALS ===== */
        .modal{
            position:absolute;top:0;left:0;right:0;bottom:0;
            background:#0f0f16;
            z-index:50;display:none;flex-direction:column;
            padding:24px 20px;
            padding-top:max(24px, env(safe-area-inset-top));
            overflow-y:auto;-webkit-overflow-scrolling:touch;
        }
        .modal.active{display:flex;animation:modalIn 0.3s cubic-bezier(0.4,0,0.2,1);}
        @keyframes modalIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
        .modal-header{
            display:flex;justify-content:space-between;align-items:center;
            margin-bottom:24px;
        }
        .modal-header h2{
            font-size:1.35rem;font-weight:800;
            letter-spacing:-0.02em;
            background:var(--gradient);
            -webkit-background-clip:text;background-clip:text;
            -webkit-text-fill-color:transparent;
        }

        /* ===== FORMS ===== */
        .form-group{margin-bottom:18px;}
        .form-group label{
            display:block;font-size:0.78rem;
            color:var(--text-secondary);
            margin-bottom:8px;
            font-weight:700;
            text-transform:uppercase;
            letter-spacing:0.05em;
        }
        .form-input{
            width:100%;padding:14px 16px;
            background:var(--surface-2);
            border:1px solid var(--border);
            color:var(--text);
            border-radius:14px;
            outline:none;
            font-size:16px;font-weight:500;
            transition:all 0.2s;
        }
        .form-input:focus{
            border-color:var(--primary);
            background:rgba(139,92,246,0.05);
            box-shadow:0 0 0 3px rgba(139,92,246,0.15);
        }
        .form-input::placeholder{color:var(--text-muted);}

        /* ===== BUTTONS ===== */
        .btn{
            width:100%;padding:15px;
            background:var(--gradient);
            color:#fff;border:none;
            border-radius:14px;
            font-weight:700;cursor:pointer;
            font-size:0.95rem;
            margin-top:8px;min-height:52px;
            transition:all 0.2s cubic-bezier(0.4,0,0.2,1);
            box-shadow:0 6px 20px rgba(139,92,246,0.3);
            letter-spacing:0.01em;
            font-family:inherit;
        }
        .btn:active{
            transform:scale(0.97);
            box-shadow:0 3px 10px rgba(139,92,246,0.4);
        }
        .btn-secondary{
            background:var(--surface-2);
            color:var(--text);
            border:1px solid var(--border);
            box-shadow:none;
        }
        .btn-secondary:active{
            background:var(--surface-3);
            box-shadow:none;
        }
        .btn-danger{
            background:var(--danger);
            box-shadow:0 6px 20px rgba(244,63,94,0.3);
        }
        .btn-sm{
            padding:9px 16px;font-size:0.82rem;
            width:auto;min-height:38px;
            border-radius:12px;
        }

        /* ===== CALL SCREEN ===== */
        #call-screen{
            background:#000;
            z-index:60;
            justify-content:space-between;align-items:center;
            padding:40px 24px;
            padding-top:max(40px, env(safe-area-inset-top));
            padding-bottom:max(40px, env(safe-area-inset-bottom));
        }
        .video-container{
            position:absolute;top:0;left:0;width:100%;height:100%;
            overflow:hidden;
        }
        #remoteVideo{width:100%;height:100%;object-fit:cover;background:#000;}
        #localVideo{
            position:absolute;
            top:calc(20px + env(safe-area-inset-top));
            right:16px;
            width:100px;height:150px;
            object-fit:cover;border-radius:16px;
            border:2px solid rgba(139,92,246,0.6);
            box-shadow:0 8px 24px rgba(139,92,246,0.4);
            z-index:61;cursor:grab;background:#222;
            touch-action:none;
        }
        #voice-call-ui{
            display:flex;flex-direction:column;align-items:center;
            z-index:61;margin-top:60px;
        }
        #voice-call-ui img{
            width:130px;height:130px;
            border-radius:36px;
            margin-bottom:24px;
            border:3px solid rgba(139,92,246,0.5);
            box-shadow:0 0 40px rgba(139,92,246,0.5), 0 0 80px rgba(6,182,212,0.3);
            animation:pulse 2.5s ease-in-out infinite;
        }
        @keyframes pulse{
            0%,100%{box-shadow:0 0 40px rgba(139,92,246,0.5), 0 0 80px rgba(6,182,212,0.3);}
            50%{box-shadow:0 0 60px rgba(139,92,246,0.7), 0 0 100px rgba(6,182,212,0.5);}
        }
        .call-controls{
            z-index:62;display:flex;gap:24px;margin-bottom:20px;
        }
        .btn-call-action{
            width:66px;height:66px;
            border-radius:50%;
            display:flex;justify-content:center;align-items:center;
            font-size:1.4rem;border:none;cursor:pointer;
            transition:transform 0.15s cubic-bezier(0.4,0,0.2,1);
            box-shadow:0 8px 24px rgba(0,0,0,0.5);
        }
        .btn-call-action:active{transform:scale(0.9);}
        .action-btns-row{display:flex;gap:8px;}

        /* ===== AUTH SCREEN SPECIAL ===== */
        #auth-modal{
            background:
                radial-gradient(circle at 50% 0%, rgba(139,92,246,0.2) 0%, transparent 60%),
                radial-gradient(circle at 50% 100%, rgba(6,182,212,0.15) 0%, transparent 60%),
                #0f0f16;
            justify-content:center;
        }
        .auth-logo{
            text-align:center;
            margin-bottom:40px;
        }
        .auth-logo h1{
            font-size:2.6rem;font-weight:800;
            background:var(--gradient);
            -webkit-background-clip:text;background-clip:text;
            -webkit-text-fill-color:transparent;
            letter-spacing:-0.04em;
            margin-bottom:8px;
        }
        .auth-logo p{
            color:var(--text-secondary);
            font-size:0.88rem;font-weight:600;
            letter-spacing:0.02em;
        }

        /* Empty state */
        .empty-state{
            padding:60px 30px;
            text-align:center;
            color:var(--text-secondary);
            font-weight:500;
            font-size:0.9rem;
            line-height:1.6;
        }
    </style>
</head>
<body>

<div id="app-container">
    <div class="menu-overlay" id="menu-overlay"></div>
    <div class="side-menu" id="side-menu">
        <div class="profile-card">
            <img id="menu-dp" src="" class="avatar" alt="DP">
            <h2 id="menu-name" style="font-size:1.15rem;font-weight:800;letter-spacing:-0.01em;">User Name</h2>
            <p id="menu-id" style="color:var(--primary-2);font-size:0.82rem;margin-top:4px;font-weight:700;letter-spacing:0.02em;"></p>
            <p id="menu-bio" style="color:var(--text-secondary);font-size:0.82rem;margin-top:8px;font-weight:500;"></p>
        </div>
        <button class="btn btn-secondary" id="edit-profile-btn" style="margin-bottom:10px;"><i class="fa-solid fa-pen"></i> Edit Profile</button>
        <button class="btn btn-danger" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </div>

    <header id="main-header">
        <div style="display:flex;align-items:center;gap:8px;">
            <button class="icon-btn" id="open-menu-btn"><i class="fa-solid fa-bars"></i></button>
            <h1>BS Chats</h1>
        </div>
        <div class="header-actions">
            <button class="icon-btn primary-btn" id="add-friend-btn"><i class="fa-solid fa-user-plus"></i></button>
        </div>
    </header>

    <main>
        <div class="view active" id="view-chats"><div id="contacts-list"></div></div>
        <div class="view" id="view-requests"><div id="requests-list"></div></div>
        <div class="view" id="view-calls"><div id="calls-list"></div></div>
        <div class="view" id="chat-view">

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { getDatabase, ref, set, get, child, onValue, push, update, remove, onDisconnect, serverTimestamp, query, orderByChild, equalTo, runTransaction } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCsTasTcFUTfVDlREZUvI3AnKB6A75hpT4",
        authDomain: "chat-3f0db.firebaseapp.com",
        databaseURL: "https://chat-3f0db-default-rtdb.asia-southeast1.firebasedatabase.app/",
        projectId: "chat-3f0db",
        storageBucket: "chat-3f0db.firebasestorage.app",
        messagingSenderId: "583034818044",
        appId: "1:583034818044:web:5bd4b1bf2c5e2c8651f679"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUser = null, currentUserData = null;
    let activeChatUserId = null, activeChatId = null;
    let typingTimeout = null, pc = null, localStream = null;
    let currentCallId = null, currentCallPeerId = null, callType = null;
    let isCaller = false, callStartTime = null, isMuted = false;
    let appInitialized = false, chatListeners = [], contactsCache = {};

    const rtcConfig = {
        iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' }
        ],
        iceCandidatePoolSize: 10,
        bundlePolicy: 'max-bundle',
        rtcpMuxPolicy: 'require'
    };

    const AUDIO_CONSTRAINTS = { echoCancellation: true, noiseSuppression: true, autoGainControl: true };
    const HQ_VIDEO = { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } };

    function tuneOpusSDP(sdp) {
        if (!sdp) return sdp;
        const opusMatch = sdp.match(/a=rtpmap:(\d+) opus\/48000/);
        if (!opusMatch) return sdp;
        const opusPT = opusMatch[1];
        sdp = sdp.replace(/(m=audio \d+ [\w\/]+\/[\w\/]+\/[\w\/]+ )(.+)/, (match, prefix, codecs) => {
            const list = codecs.split(' ').filter(c => c !== opusPT);
            return prefix + opusPT + ' ' + list.join(' ');
        });
        sdp = sdp.replace(new RegExp(`a=fmtp:${opusPT} [^\r\n]*`),
            `a=fmtp:${opusPT} minptime=10;useinbandfec=1;usedtx=0;maxaveragebitrate=64000;maxplaybackrate=48000;stereo=0;sprop-stereo=0`);
        return sdp;
    }

    function killJitterBuffer(peerConnection) {
        peerConnection.getReceivers().forEach(receiver => {
            if (receiver.track && receiver.track.kind === 'audio') {
                try { receiver.playoutDelayHint = 0; } catch(e) {}
                try { receiver.jitterBufferTarget = 0; } catch(e) {}
            }
        });
    }

    async function boostAudioBitrate(peerConnection) {
        const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'audio');
        if (!sender) return;
        try {
            const params = sender.getParameters();
            if (!params.encodings || params.encodings.length === 0) params.encodings = [{}];
            params.encodings[0].maxBitrate = 64000;
            params.encodings[0].priority = 'high';
            await sender.setParameters(params);
        } catch(e) { console.warn('Bitrate boost failed:', e); }
    }

    let ringtoneSynth = null, ringtoneLoop = null;
    function initRingtone() {
        if (!ringtoneSynth) {
            ringtoneSynth = new Tone.Synth().toDestination();
            ringtoneLoop = new Tone.Loop(time => {
                ringtoneSynth.triggerAttackRelease("C5", "8n", time);
                ringtoneSynth.triggerAttackRelease("E5", "8n", time + 0.2);
            }, "1s");
        }
    }
    function startRingtone() { try { Tone.start(); initRingtone(); Tone.Transport.start(); ringtoneLoop.start(0); } catch(e){} }
    function stopRingtone() { try { if (ringtoneLoop) { ringtoneLoop.stop(); Tone.Transport.stop(); } } catch(e){} }

    function emojiToSVG(content) {
        const text = (content || "BS").substring(0, 2);
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#g)"/><text x="50%" y="55%" font-size="45" dominant-baseline="middle" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="bold">${text}</text></svg>`;
        return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
    }

    function showModal(id) { document.getElementById(id).classList.add('active'); }
    function hideModal(id) { document.getElementById(id).classList.remove('active'); }

    function navigateTo(hash, replace = false) {
        if (replace) { history.replaceState(null, '', hash); handleRoute(); }
        else location.hash = hash;
    }

    function handleRoute() {
        if (!currentUser) return;
        const hash = location.hash || '#chats';
        document.getElementById('chat-view').classList.remove('active');
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        if (hash.startsWith('#chat/')) {
            const userId = hash.substring(6);
            const friend = Object.values(contactsCache).find(c => c.userId === userId);
            if (friend) { openChatView(friend, false); return; }
            navigateTo('#chats', true); return;
        } else if (hash === '#requests') {
            document.getElementById('view-requests').classList.add('active');
            document.querySelector('[data-target="view-requests"]').classList.add('active');
        } else if (hash === '#calls') {
            document.getElementById('view-calls').classList.add('active');
            document.querySelector('[data-target="view-calls"]').classList.add('active');
        } else {
            document.getElementById('view-chats').classList.add('active');
            document.querySelector('[data-target="view-chats"]').classList.add('active');
        }
    }

    window.addEventListener('hashchange', () => {
        if (!location.hash.startsWith('#chat/')) {
            chatListeners.forEach(u => u()); chatListeners = [];
            activeChatUserId = null; activeChatId = null;
        }
        handleRoute();
    });

    document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', () => navigateTo(btn.getAttribute('data-hash') || '#chats'));
    });

    document.getElementById('open-menu-btn').addEventListener('click', () => {
        document.getElementById('side-menu').classList.add('open');
        document.getElementById('menu-overlay').classList.add('open');
    });
    function closeSideMenu() {
        document.getElementById('side-menu').classList.remove('open');
        document.getElementById('menu-overlay').classList.remove('open');
    }
    document.getElementById('menu-overlay').addEventListener('click', closeSideMenu);

    document.getElementById('profile-emoji').addEventListener('input', (e) => {
        document.getElementById('profile-preview-dp').src = emojiToSVG(e.target.value);
    });

    document.getElementById('login-btn').addEventListener('click', () => {
        signInWithEmailAndPassword(auth, document.getElementById('auth-email').value, document.getElementById('auth-password').value).catch(err => alert(err.message));
    });
    document.getElementById('signup-btn').addEventListener('click', () => {
        createUserWithEmailAndPassword(auth, document.getElementById('auth-email').value, document.getElementById('auth-password').value).catch(err => alert(err.message));
    });
    document.getElementById('logout-btn').addEventListener('click', () => {
        signOut(auth).then(() => { closeSideMenu(); location.reload(); });
    });

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user; hideModal('auth-modal');
            const snap = await get(ref(db, `users/${user.uid}`));
            if (!snap.exists()) showModal('profile-modal');
            else {
                currentUserData = snap.val();
                loadUserDataUI();
                if (!appInitialized) {
                    appInitialized = true;
                    initPresence(); listenForContacts(); listenForRequests(); listenForCallsIncoming(); listenForCallLogs();
                    handleRoute();
                }
            }
        } else {
            currentUser = null; currentUserData = null; appInitialized = false; contactsCache = {};
            showModal('auth-modal');
        }
    });

    document.getElementById('save-profile-btn').addEventListener('click', async () => {
        const name = document.getElementById('profile-name').value.trim();
        const bio = document.getElementById('profile-bio').value.trim();
        const emoji = document.getElementById('profile-emoji').value.trim() || '💬';
        if (!name) return alert('Name is required');
        let userIdTag = currentUserData?.userId;
        if (!userIdTag) userIdTag = 'bs-' + Math.floor(1000 + Math.random() * 9000);
        const profileData = { uid: currentUser.uid, name, bio, emoji, userId: userIdTag, dpUrl: emojiToSVG(emoji) };
        await set(ref(db, `users/${currentUser.uid}`), profileData);
        await set(ref(db, `userIndex/${userIdTag}`), currentUser.uid);
        currentUserData = profileData; hideModal('profile-modal'); loadUserDataUI();
        if (!appInitialized) {
            appInitialized = true;
            initPresence(); listenForContacts(); listenForRequests(); listenForCallsIncoming(); listenForCallLogs();
            handleRoute();
        }
    });

    document.getElementById('edit-profile-btn').addEventListener('click', () => {
        closeSideMenu();
        if (currentUserData) {
            document.getElementById('profile-name').value = currentUserData.name || '';
            document.getElementById('profile-bio').value = currentUserData.bio || '';
            document.getElementById('profile-emoji').value = currentUserData.emoji || '';
            document.getElementById('profile-preview-dp').src = currentUserData.dpUrl || emojiToSVG('');
        }
        showModal('profile-modal');
    });

    function loadUserDataUI() {
        document.getElementById('menu-dp').src = currentUserData.dpUrl;
        document.getElementById('menu-name').textContent = currentUserData.name;
        document.getElementById('menu-id').textContent = currentUserData.userId;
        document.getElementById('menu-bio').textContent = currentUserData.bio || 'No bio set';
    }

    function initPresence() {
        const myStatusRef = ref(db, `status/${currentUser.uid}`);
        onValue(ref(db, '.info/connected'), (snap) => {
            if (snap.val() === true) {
                onDisconnect(myStatusRef).set({ state: 'offline', last_changed: serverTimestamp() })
                .then(() => set(myStatusRef, { state: 'online', last_changed: serverTimestamp() }));
            }
        });
    }

    document.getElementById('add-friend-btn').addEventListener('click', () => showModal('add-friend-modal'));
    document.getElementById('close-add-friend-btn').addEventListener('click', () => hideModal('add-friend-modal'));

    document.getElementById('search-user-btn').addEventListener('click', async () => {
        const queryId = document.getElementById('search-user-id').value.trim();
        const resDiv = document.getElementById('search-result'); resDiv.innerHTML = '';
        if (!queryId) return;
        const snap = await get(ref(db, `userIndex/${queryId}`));
        if (snap.exists()) {
            const targetUid = snap.val();
            if (targetUid === currentUser.uid) { resDiv.innerHTML = '<p style="color:var(--danger);text-align:center;font-weight:600;">Cannot add yourself.</p>'; return; }
            const targetData = (await get(ref(db, `users/${targetUid}`))).val();
            resDiv.innerHTML = `<div class="list-item" style="margin:0;border:1px solid var(--border);background:var(--surface-2);"><img src="${targetData.dpUrl}" class="avatar"><div class="list-details"><div class="list-title">${targetData.name}</div><div class="list-subtitle">${targetData.userId}</div></div><button class="btn btn-sm" id="send-req-btn">Send</button></div>`;
            document.getElementById('send-req-btn').addEventListener('click', async () => {
                await set(ref(db, `requests/${targetUid}/${currentUser.uid}`), { from: currentUser.uid, status: 'pending', timestamp: serverTimestamp() });
                alert('Request sent!'); hideModal('add-friend-modal');
            });
        } else resDiv.innerHTML = '<p style="color:var(--text-secondary);text-align:center;font-weight:500;">User not found.</p>';
    });

    function listenForRequests() {
        onValue(ref(db, `requests/${currentUser.uid}`), async (snap) => {
            const reqs = snap.val();
            const container = document.getElementById('requests-list');
            const badge = document.getElementById('requests-badge');
            container.innerHTML = '';
            if (!reqs) {
                badge.style.display = 'none';
                container.innerHTML = '<div class="empty-state">No pending requests</div>';
                return;
            }
            const keys = Object.keys(reqs);
            badge.textContent = keys.length;
            badge.style.display = keys.length > 0 ? 'inline-block' : 'none';
            for (let fromUid of keys) {
                const uData = (await get(ref(db, `users/${fromUid}`))).val();
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `<img src="${uData.dpUrl}" class="avatar"><div class="list-details"><div class="list-title">${uData.name}</div><div class="list-subtitle">${uData.userId}</div></div><div class="action-btns-row"><button class="btn btn-sm accept-btn"><i class="fa-solid fa-check"></i></button><button class="btn btn-sm btn-danger reject-btn"><i class="fa-solid fa-xmark"></i></button></div>`;
                div.querySelector('.accept-btn').addEventListener('click', async () => {
                    await set(ref(db, `contacts/${currentUser.uid}/${fromUid}`), true);
                    await set(ref(db, `contacts/${fromUid}/${currentUser.uid}`), true);
                    await remove(ref(db, `requests/${currentUser.uid}/${fromUid}`));
                });
                div.querySelector('.reject-btn').addEventListener('click', () => remove(ref(db, `requests/${currentUser.uid}/${fromUid}`)));
                container.appendChild(div);
            }
        });
    }

    function getChatId(a, b) { return a < b ? `${a}_${b}` : `${b}_${a}`; }

    function listenForContacts() {
        onValue(ref(db, `contacts/${currentUser.uid}`), async (snap) => {
            const contacts = snap.val();
            const container = document.getElementById('contacts-list');
            container.innerHTML = ''; contactsCache = {};
            if (!contacts) { container.innerHTML = '<div class="empty-state">No contacts yet.<br>Tap + to add friends!</div>'; return; }
            for (let friendUid of Object.keys(contacts)) {
                const friendData = (await get(ref(db, `users/${friendUid}`))).val();
                contactsCache[friendUid] = friendData;
                const chatId = getChatId(currentUser.uid, friendUid);
                const item = document.createElement('div');
                item.className = 'list-item';
                item.innerHTML = `<img src="${friendData.dpUrl}" class="avatar"><div class="list-details"><div class="list-title"><span>${friendData.name}</span><span class="status-dot offline" id="dot-${friendUid}"></span></div><div class="list-subtitle">${friendData.userId}</div></div><div id="unread-${chatId}" class="badge" style="display:none;position:relative;right:0;">0</div>`;
                item.addEventListener('click', () => navigateTo(`#chat/${friendData.userId}`));
                container.appendChild(item);
                onValue(ref(db, `status/${friendUid}`), (s) => {
                    const st = s.val();
                    const dot = document.getElementById(`dot-${friendUid}`);
                    if (dot && st) dot.className = `status-dot ${st.state === 'online' ? 'online' : 'offline'}`;
                });
                onValue(ref(db, `unreadCounts/${currentUser.uid}/${chatId}`), (u) => {
                    const count = u.val() || 0;
                    const badge = document.getElementById(`unread-${chatId}`);
                    if (badge) { badge.textContent = count; badge.style.display = count > 0 ? 'inline-block' : 'none'; }
                });
            }
            if (location.hash.startsWith('#chat/')) handleRoute();
        });
    }

    async function openChatView(friendData, updateHash = true) {
        activeChatUserId = friendData.uid;
        activeChatId = getChatId(currentUser.uid, friendData.uid);
        document.getElementById('chat-header-name').textContent = friendData.name;
        document.getElementById('chat-header-dp').src = friendData.dpUrl;
        document.getElementById('chat-view').classList.add('active');
        if (updateHash) navigateTo(`#chat/${friendData.userId}`);
        await set(ref(db, `unreadCounts/${currentUser.uid}/${activeChatId}`), 0);
        chatListeners.forEach(u => u()); chatListeners = [];
        chatListeners.push(onValue(ref(db, `status/${friendData.uid}`), (s) => {
            const st = s.val();
            document.getElementById('chat-header-status').textContent = (st && st.state === 'online') ? 'Online' : 'Offline';
        }));
        chatListeners.push(onValue(ref(db, `typing/${activeChatId}/${activeChatUserId}`), (t) => {
            document.getElementById('typing-indicator').textContent = t.val() ? `${friendData.name} is typing...` : '';
        }));
        loadMessages();
    }

    document.getElementById('close-chat-btn').addEventListener('click', () => navigateTo('#chats'));
    document.getElementById('clear-chat-btn').addEventListener('click', async () => {
        if (!activeChatId) return;
        if (confirm("Clear all messages?")) {
            await set(ref(db, `userChats/${currentUser.uid}/${activeChatId}/clearedAt`), serverTimestamp());
            loadMessages();
        }
    });

    async function loadMessages() {
        const container = document.getElementById('chat-messages');
        container.innerHTML = '';
        const clearedAt = (await get(ref(db, `userChats/${currentUser.uid}/${activeChatId}/clearedAt`))).val() || 0;
        chatListeners.push(onValue(ref(db, `messages/${activeChatId}`), (s) => {
            const isAtBottom = container.scrollHeight - container.clientHeight <= container.scrollTop + 60;
            container.innerHTML = '';
            const msgs = s.val();
            if (msgs) {
                Object.values(msgs).forEach(m => {
                    if (m.timestamp > clearedAt) {
                        const b = document.createElement('div');
                        b.className = `message-bubble ${m.sender === currentUser.uid ? 'me' : 'other'}`;
                        const t = m.timestamp ? new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
                        b.innerHTML = `<div>${m.text}</div><div class="message-time">${t}</div>`;
                        container.appendChild(b);
                    }
                });
                if (isAtBottom) container.scrollTop = container.scrollHeight;
            }
        }));
    }

    const msgInput = document.getElementById('message-input');
    msgInput.addEventListener('input', () => {
        if (!activeChatId) return;
        set(ref(db, `typing/${activeChatId}/${currentUser.uid}`), true);
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => set(ref(db, `typing/${activeChatId}/${currentUser.uid}`), false), 3000);
    });

    async function sendMessage() {
        const text = msgInput.value.trim();
        if (!text || !activeChatId) return;
        msgInput.value = '';
        set(ref(db, `typing/${activeChatId}/${currentUser.uid}`), false);
        await push(ref(db, `messages/${activeChatId}`), { sender: currentUser.uid, text, timestamp: serverTimestamp() });
        runTransaction(ref(db, `unreadCounts/${activeChatUserId}/${activeChatId}`), (c) => (c || 0) + 1);
    }
    document.getElementById('send-btn').addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    document.getElementById('voice-call-btn').addEventListener('click', () => initiateCall('voice'));
    document.getElementById('video-call-btn').addEventListener('click', () => initiateCall('video'));

    async function initiateCall(type) {
        callType = type; isCaller = true;
        currentCallPeerId = activeChatUserId;
        currentCallId = getChatId(currentUser.uid, activeChatUserId);
        setupCallUI(type, activeChatUserId);
        showModal('call-screen');
        try {
            localStream = await navigator.mediaDevices.getUserMedia({
                audio: AUDIO_CONSTRAINTS,
                video: type === 'video' ? HQ_VIDEO : false
            });
        } catch (err) { alert("Could not access camera/microphone."); hideModal('call-screen'); return; }
        document.getElementById('localVideo').srcObject = localStream;
        pc = new RTCPeerConnection(rtcConfig);
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
        await boostAudioBitrate(pc);
        pc.ontrack = (event) => {
            const rv = document.getElementById('remoteVideo');
            rv.srcObject = event.streams[0];
            rv.play().catch(e => console.log("Autoplay blocked:", e));
            killJitterBuffer(pc);
        };
        const callRef = ref(db, `calls/${currentCallId}`);
        const candidatesRef = child(callRef, 'callerCandidates');
        pc.onicecandidate = (e) => { if (e.candidate) push(candidatesRef, e.candidate.toJSON()); };
        const offer = await pc.createOffer();
        offer.sdp = tuneOpusSDP(offer.sdp);
        await pc.setLocalDescription(offer);
        await set(callRef, {
            type: callType, caller: currentUser.uid, receiver: activeChatUserId,
            offer: { type: offer.type, sdp: offer.sdp }, status: 'calling'
        });
        onValue(child(callRef, 'answer'), async (s) => {
            const answer = s.val();
            if (answer && pc && !pc.currentRemoteDescription) {
                try {
                    await pc.setRemoteDescription(new RTCSessionDescription(answer));
                    callStartTime = Date.now();
                    document.getElementById('call-status').textContent = 'Connected';
                    killJitterBuffer(pc);
                } catch(e) { console.error(e); }
            }
        });
        onValue(child(callRef, 'calleeCandidates'), (s) => {
            s.forEach(c => { try { pc.addIceCandidate(new RTCIceCandidate(c.val())); } catch(e){} });
        });
        onValue(child(callRef, 'status'), (s) => {
            if (s.val() === 'ended' || s.val() === 'rejected') cleanUpCall();
        });
    }

    function listenForCallsIncoming() {
        const q = query(ref(db, 'calls'), orderByChild('receiver'), equalTo(currentUser.uid));
        onValue(q, async (snap) => {
            const calls = snap.val();
            if (!calls) return;
            Object.keys(calls).forEach(async (cId) => {
                const call = calls[cId];
                if (call.status === 'calling' && !currentCallId) {
                    currentCallId = cId; currentCallPeerId = call.caller; callType = call.type;
                    const callerData = (await get(ref(db, `users/${call.caller}`))).val();
                    document.getElementById('incoming-caller-name').textContent = callerData.name;
                    document.getElementById('incoming-caller-dp').src = callerData.dpUrl;
                    document.getElementById('incoming-call-type').textContent = `Incoming ${call.type.toUpperCase()} call...`;
                    startRingtone();
                    showModal('incoming-call-modal');
                }
            });
        });
    }

    document.getElementById('accept-call-btn').addEventListener('click', async () => {
        stopRingtone(); hideModal('incoming-call-modal'); showModal('call-screen');
        const call = (await get(ref(db, `calls/${currentCallId}`))).val();
        setupCallUI(call.type, call.caller);
        try {
            localStream = await navigator.mediaDevices.getUserMedia({
                audio: AUDIO_CONSTRAINTS,
                video: call.type === 'video' ? HQ_VIDEO : false
            });
        } catch (err) { alert("Could not access camera/microphone."); return; }
        document.getElementById('localVideo').srcObject = localStream;
        pc = new RTCPeerConnection(rtcConfig);
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
        await boostAudioBitrate(pc);
        pc.ontrack = (event) => {
            const rv = document.getElementById('remoteVideo');
            rv.srcObject = event.streams[0];
            rv.play().catch(e => console.log("Autoplay blocked:", e));
            killJitterBuffer(pc);
        };
        const callRef = ref(db, `calls/${currentCallId}`);
        const calleeCandidatesRef = child(callRef, 'calleeCandidates');
        pc.onicecandidate = (e) => { if (e.candidate) push(calleeCandidatesRef, e.candidate.toJSON()); };
        try {
            await pc.setRemoteDescription(new RTCSessionDescription(call.offer));
            const answer = await pc.createAnswer();
            answer.sdp = tuneOpusSDP(answer.sdp);
            await pc.setLocalDescription(answer);
            await update(callRef, { answer: { type: answer.type, sdp: answer.sdp }, status: 'connected' });
            callStartTime = Date.now();
            document.getElementById('call-status').textContent = 'Connected';
            killJitterBuffer(pc);
            onValue(child(callRef, 'callerCandidates'), (s) => {
                s.forEach(c => { try { pc.addIceCandidate(new RTCIceCandidate(c.val())); } catch(e){} });
            });
            onValue(child(callRef, 'status'), (s) => { if (s.val() === 'ended') cleanUpCall(); });
        } catch(e) { console.error(e); cleanUpCall(); }
    });

    document.getElementById('reject-call-btn').addEventListener('click', async () => {
        stopRingtone(); hideModal('incoming-call-modal');
        if (currentCallId) {
            await update(ref(db, `calls/${currentCallId}`), { status: 'rejected' });
            logCall('missed', 0, currentCallPeerId);
            remove(ref(db, `calls/${currentCallId}`));
            currentCallId = null; currentCallPeerId = null;
        }
    });

    async function setupCallUI(type, otherUid) {
        const uData = (await get(ref(db, `users/${otherUid}`))).val();
        if (type === 'video') {
            document.getElementById('video-container').style.display = 'block';
            document.getElementById('voice-call-ui').style.display = 'none';
        } else {
            document.getElementById('video-container').style.display = 'none';
            document.getElementById('voice-call-ui').style.display = 'flex';
            document.getElementById('call-user-dp').src = uData.dpUrl;
            document.getElementById('call-user-name').textContent = uData.name;
            document.getElementById('call-status').textContent = 'Ringing...';
        }
    }

    document.getElementById('toggle-audio-btn').addEventListener('click', () => {
        if (localStream && localStream.getAudioTracks().length > 0) {
            isMuted = !isMuted;
            localStream.getAudioTracks()[0].enabled = !isMuted;
            document.getElementById('toggle-audio-btn').style.background = isMuted ? 'var(--danger)' : 'var(--surface-2)';
        }
    });

    document.getElementById('end-call-btn').addEventListener('click', async () => {
        if (currentCallId) {
            await update(ref(db, `calls/${currentCallId}`), { status: 'ended' });
            cleanUpCall();
        }
    });

    function cleanUpCall() {
        stopRingtone();
        const duration = callStartTime ? Math.round((Date.now() - callStartTime) / 1000) : 0;
        if (currentCallId) {
            if (callStartTime || isCaller) logCall(duration > 0 ? callType : 'missed', duration, currentCallPeerId);
            remove(ref(db, `calls/${currentCallId}`));
        }
        if (pc) { pc.close(); pc = null; }
        if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
        hideModal('call-screen'); hideModal('incoming-call-modal');
        callStartTime = null; currentCallId = null; currentCallPeerId = null; isCaller = false; isMuted = false;
        document.getElementById('toggle-audio-btn').style.background = 'var(--surface-2)';
    }

    async function logCall(type, duration, peerId) {
        if (!peerId) return;
        await push(ref(db, `callLogs/${currentUser.uid}`), { type, duration, timestamp: serverTimestamp(), peer: peerId });
    }

    function listenForCallLogs() {
        onValue(ref(db, `callLogs/${currentUser.uid}`), async (snap) => {
            const container = document.getElementById('calls-list');
            container.innerHTML = '';
            const logs = snap.val();
            if (!logs) { container.innerHTML = '<div class="empty-state">No call history</div>'; return; }
            for (let k of Object.keys(logs).reverse()) {
                const log = logs[k];
                const pData = (await get(ref(db, `users/${log.peer}`))).val() || { name: 'Unknown', dpUrl: emojiToSVG('?') };
                const item = document.createElement('div');
                item.className = 'list-item';
                const t = log.timestamp ? new Date(log.timestamp).toLocaleString() : '';
                const icon = log.type === 'missed' ? '<i class="fa-solid fa-phone-slash" style="color:var(--danger);font-size:0.75rem;"></i> ' : '<i class="fa-solid fa-phone" style="color:var(--success);font-size:0.75rem;"></i> ';
                item.innerHTML = `<img src="${pData.dpUrl}" class="avatar"><div class="list-details"><div class="list-title">${pData.name}</div><div class="list-subtitle">${icon}${log.type.toUpperCase()} • ${log.duration}s • ${t}</div></div>`;
                container.appendChild(item);
            }
        });
    }

    const localVideoEl = document.getElementById("localVideo");
    let isDragging = false, currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;
    localVideoEl.addEventListener("touchstart", dragStart, { passive: false });
    localVideoEl.addEventListener("touchend", dragEnd);
    localVideoEl.addEventListener("touchmove", drag, { passive: false });
    localVideoEl.addEventListener("mousedown", dragStart);
    localVideoEl.addEventListener("mouseup", dragEnd);
    localVideoEl.addEventListener("mousemove", drag);
    function dragStart(e) {
        initialX = (e.type === "touchstart" ? e.touches[0].clientX : e.clientX) - xOffset;
        initialY = (e.type === "touchstart" ? e.touches[0].clientY : e.clientY) - yOffset;
        if (e.target === localVideoEl) { isDragging = true; localVideoEl.style.cursor = 'grabbing'; }
    }
    function dragEnd() { initialX = currentX; initialY = currentY; isDragging = false; localVideoEl.style.cursor = 'grab'; }
    function drag(e) {
        if (isDragging) {
            e.preventDefault();
            currentX = (e.type === "touchmove" ? e.touches[0].clientX : e.clientX) - initialX;
            currentY = (e.type === "touchmove" ? e.touches[0].clientY : e.clientY) - initialY;
            xOffset = currentX; yOffset = currentY;
            localVideoEl.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
        }
    }

    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', () => {
            document.documentElement.style.height = window.visualViewport.height + 'px';
        });
    }
</script>
</body>
</html>
