<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>BS Chats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root{
            --primary: #8b5cf6;
            --primary-2: #06b6d4;
            --gradient: linear-gradient(135deg, #8b5cf6 0%, #06b6d4 100%);
            --gradient-soft: linear-gradient(135deg, rgba(139,92,246,0.15) 0%, rgba(6,182,212,0.15) 100%);
            --bg: #0a0a0f;
            --surface-solid: #16161e;
            --surface-2: #1f1f2a;
            --surface-3: #2a2a38;
            --text: #f5f5f7;
            --text-secondary: #8b8b9a;
            --text-muted: #5a5a6a;
            --danger: #f43f5e;
            --success: #10b981;
            --border: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(139, 92, 246, 0.3);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
        *{scrollbar-width:thin;scrollbar-color:rgba(139,92,246,0.4) transparent;}
        *::-webkit-scrollbar{width:6px;height:6px;}
        *::-webkit-scrollbar-track{background:transparent;}
        *::-webkit-scrollbar-thumb{background:rgba(139,92,246,0.4);border-radius:3px;}
        *::-webkit-scrollbar-thumb:hover{background:rgba(6,182,212,0.7);}
        html{height:100%;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}
        body{
            background:#000;color:var(--text);display:flex;justify-content:center;align-items:center;
            min-height:100vh;min-height:100dvh;min-height:-webkit-fill-available;
            overflow:hidden;overscroll-behavior-y:contain;position:fixed;width:100%;height:100%;top:0;left:0;
            background-image:radial-gradient(circle at 15% 15%, rgba(139,92,246,0.15) 0%, transparent 45%),radial-gradient(circle at 85% 85%, rgba(6,182,212,0.15) 0%, transparent 45%);
        }
        #app-container{
            width:100%;max-width:420px;height:100vh;height:100dvh;max-height:880px;
            background:radial-gradient(circle at 20% 0%, rgba(139,92,246,0.08) 0%, transparent 40%),radial-gradient(circle at 80% 100%, rgba(6,182,212,0.08) 0%, transparent 40%),#0f0f16;
            position:relative;display:flex;flex-direction:column;overflow:hidden;
            box-shadow:0 0 60px rgba(139,92,246,0.2), 0 0 100px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.05);
            border-radius:28px;border:1px solid rgba(255,255,255,0.08);
        }
        @media (max-width: 520px) {
            body{background:var(--bg);background-image:none;}
            #app-container{max-width:100%;max-height:100vh;max-height:100dvh;border-radius:0;border:none;box-shadow:none;height:100vh;height:100dvh;}
        }
        @media (max-width: 360px) {
            header h1 { font-size: 1.05rem; }
            .avatar { width: 40px; height: 40px; border-radius: 12px; }
            .avatar-sm { width: 34px; height: 34px; border-radius: 10px; }
            .list-item { padding: 12px 14px; min-height: 64px; margin: 3px 8px; }
            .list-title { font-size: 0.9rem; }
            .list-subtitle { font-size: 0.75rem; }
            .icon-btn { width: 40px; height: 40px; }
            .nav-item { font-size: 0.62rem; padding: 6px 8px; }
            .nav-item i { font-size: 1rem; }
            .chat-input { padding: 11px 14px; }
            .send-btn { width: 42px; height: 42px; min-width: 42px; }
            .message-bubble { font-size: 0.85rem; padding: 9px 12px; }
            .btn { padding: 13px; min-height: 48px; font-size: 0.9rem; }
            .form-input { padding: 12px 14px; }
            .modal { padding: 20px 16px; }
            .btn-call-action { width: 58px; height: 58px; font-size: 1.3rem; }
            #voice-call-ui img { width: 110px; height: 110px; }
        }
        @media (max-height: 500px) and (orientation: landscape) {
            .modal { padding-top: max(12px, var(--safe-top)); padding-bottom: max(12px, var(--safe-bottom)); }
            #auth-modal { justify-content: flex-start; padding-top: max(16px, var(--safe-top)); }
            .auth-logo { margin-bottom: 20px; }
            .auth-logo h1 { font-size: 1.8rem; }
            .form-group { margin-bottom: 12px; }
            .btn { min-height: 44px; padding: 12px; }
            .side-menu { padding-top: max(16px, var(--safe-top)); }
            .profile-card { margin-bottom: 16px; padding: 16px 12px; }
            .profile-card img { width: 64px; height: 64px; }
            #voice-call-ui { margin-top: 20px; }
            #voice-call-ui img { width: 80px; height: 80px; margin-bottom: 12px; }
            .btn-call-action { width: 54px; height: 54px; }
            .call-controls { margin-bottom: 10px; }
        }
        @media (min-width: 900px) {
            #app-container { max-width: 440px; max-height: 900px; height: 90vh; }
        }

        /* ===== ✅ TOUCH ANIMATIONS ===== */
        @keyframes rippleAnim {
            from { transform: scale(0); opacity: 0.6; }
            to { transform: scale(2.5); opacity: 0; }
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes slideInLeft {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        @keyframes sendPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        @keyframes heartBeat {
            0%,100% { transform: scale(1); }
            25% { transform: scale(1.15); }
            50% { transform: scale(1); }
            75% { transform: scale(1.1); }
        }
        @keyframes glow {
            0%,100% { box-shadow: 0 0 10px rgba(139,92,246,0.4); }
            50% { box-shadow: 0 0 25px rgba(139,92,246,0.8), 0 0 40px rgba(6,182,212,0.5); }
        }

        .ripple-host {
            position: relative;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        .ripple-host .ripple-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.5);
            transform: scale(0);
            animation: rippleAnim 0.6s ease-out;
            pointer-events: none;
            z-index: 999;
        }

        /* Tap feedback for all interactive elements */
        .icon-btn, .btn, .btn-call-action, .send-btn, .nav-item, .list-item, .chip, .menu-option {
            transform: translateZ(0);
            backface-visibility: hidden;
        }
        .icon-btn:active { transform: scale(0.85) !important; }
        .btn:active, .btn-call-action:active { transform: scale(0.94) !important; }
        .send-btn:active { transform: scale(0.82) rotate(15deg) !important; }
        .nav-item:active { transform: scale(0.92) !important; }
        .list-item:active { transform: scale(0.97) !important; }

        /* Press glow */
        .icon-btn:active, .nav-item:active {
            box-shadow: 0 0 20px rgba(139,92,246,0.5);
        }

        /* Message bubble send animation */
        .message-bubble.sending {
            animation: sendPulse 0.4s ease-out;
        }

        /* Header */
        header{
            background:rgba(22,22,30,0.75);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
            padding:14px 16px;padding-top:max(14px, var(--safe-top));padding-left:max(16px, var(--safe-left));padding-right:max(16px, var(--safe-right));
            display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);
            z-index:10;min-height:64px;flex-shrink:0;position:relative;
        }
        header::after{
            content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
            background:linear-gradient(90deg, transparent, rgba(139,92,246,0.5), rgba(6,182,212,0.5), transparent);
        }
        header h1{
            font-size:clamp(1.1rem, 4vw, 1.25rem);font-weight:800;
            background:var(--gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
            letter-spacing:-0.02em;
        }
        .header-actions{display:flex;gap:8px;align-items:center;}
        .icon-btn{
            background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text);font-size:1rem;cursor:pointer;padding:0;
            width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:14px;
            transition:transform 0.15s cubic-bezier(0.4,0,0.2,1), background 0.2s, border-color 0.2s, box-shadow 0.2s;
            flex-shrink:0;-webkit-user-select:none;user-select:none;
        }
        @media (hover: hover) {
            .icon-btn:hover{background:rgba(255,255,255,0.08);border-color:rgba(139,92,246,0.3);}
        }
        .icon-btn.primary-btn{background:var(--gradient);border:none;color:#fff;box-shadow:0 4px 12px rgba(139,92,246,0.3);}
        .avatar{width:44px;height:44px;border-radius:14px;object-fit:cover;background:#000;flex-shrink:0;border:1px solid rgba(255,255,255,0.08);}
        .avatar-sm{width:38px;height:38px;border-radius:12px;}
        main{flex:1;position:relative;overflow:hidden;min-height:0;}
        .view{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-left:var(--safe-left);padding-right:var(--safe-right);}
        .view.active{display:flex;animation:viewIn 0.25s ease;}
        @keyframes viewIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

        /* Bottom nav */
        nav{
            background:rgba(22,22,30,0.9);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
            display:flex;justify-content:space-around;padding:8px 8px;padding-bottom:max(8px, var(--safe-bottom));
            padding-left:max(8px, var(--safe-left));padding-right:max(8px, var(--safe-right));
            border-top:1px solid var(--border);z-index:10;flex-shrink:0;gap:4px;
        }
        .nav-item{
            display:flex;flex-direction:column;align-items:center;color:var(--text-secondary);text-decoration:none;
            font-size:clamp(0.62rem, 2.5vw, 0.68rem);font-weight:600;gap:4px;cursor:pointer;position:relative;
            background:none;border:none;padding:8px 10px;min-height:56px;justify-content:center;border-radius:14px;
            transition:all 0.2s cubic-bezier(0.4,0,0.2,1);flex:1;letter-spacing:0.02em;text-transform:uppercase;
            -webkit-user-select:none;user-select:none;min-width:0;
        }
        .nav-item i{font-size:1.05rem;transition:transform 0.2s;}
        .nav-item.active{color:#fff;background:var(--gradient-soft);box-shadow:inset 0 0 0 1px rgba(139,92,246,0.3), 0 0 20px rgba(139,92,246,0.1);}
        .nav-item.active i{background:var(--gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;transform:translateY(-1px);}
        .nav-item span:not(.badge){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
        .badge{
            position:absolute;top:2px;right:12%;background:var(--gradient);color:#fff;font-size:0.6rem;font-weight:800;
            padding:2px 7px;border-radius:10px;min-width:20px;text-align:center;
            box-shadow:0 2px 8px rgba(139,92,246,0.5);letter-spacing:0;
        }
        .badge.pulse { animation: heartBeat 1.5s ease-in-out infinite; }

        /* List items */
        .list-item{
            display:flex;align-items:center;padding:14px 18px;cursor:pointer;
            transition:all 0.2s cubic-bezier(0.4,0,0.2,1);min-height:72px;margin:4px 12px;border-radius:16px;
            border:1px solid transparent;position:relative;-webkit-user-select:none;user-select:none;
        }
        @media (hover: hover) {
            .list-item:hover{background:rgba(255,255,255,0.03);border-color:rgba(255,255,255,0.06);}
        }
        .list-item.blocked-item { opacity: 0.75; }
        .list-details{margin-left:14px;flex:1;overflow:hidden;min-width:0;}
        .list-title{font-weight:700;font-size:clamp(0.88rem, 3.5vw, 0.95rem);display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--text);letter-spacing:-0.01em;}
        .list-title > span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
        .list-subtitle{font-size:clamp(0.75rem, 3vw, 0.8rem);color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;font-weight:500;}
        .status-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0;border:2px solid var(--surface-solid);}
        .status-dot.online{background:var(--success);box-shadow:0 0 10px rgba(16,185,129,0.6);}
        .status-dot.offline{background:var(--text-muted);}

        /* Chat */
        #chat-view{z-index:20;background:#0f0f16;}
        .chat-header{
            background:rgba(22,22,30,0.85);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
            padding:12px 14px;padding-top:max(12px, var(--safe-top));padding-left:max(14px, var(--safe-left));padding-right:max(14px, var(--safe-right));
            display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0;position:relative;
        }
        .chat-header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg, transparent, rgba(139,92,246,0.4), transparent);}
        .chat-messages{flex:1;padding:20px 16px;padding-left:max(16px, var(--safe-left));padding-right:max(16px, var(--safe-right));overflow-y:auto;display:flex;flex-direction:column;gap:12px;min-height:0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
        .message-bubble{
            max-width:78%;padding:10px 14px;border-radius:18px;font-size:clamp(0.85rem, 3.2vw, 0.9rem);font-weight:500;
            word-wrap:break-word;overflow-wrap:anywhere;position:relative;
            animation:msgIn 0.25s cubic-bezier(0.4,0,0.2,1);line-height:1.45;
        }
        @keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(0.97);}to{opacity:1;transform:translateY(0) scale(1);}}
        .message-bubble.me{align-self:flex-end;background:var(--gradient);color:#fff;border-bottom-right-radius:4px;box-shadow:0 4px 16px rgba(139,92,246,0.35);}
        .message-bubble.other{align-self:flex-start;background:var(--surface-2);color:var(--text);border-bottom-left-radius:4px;border:1px solid var(--border);}
        .message-time{font-size:0.65rem;opacity:0.75;text-align:right;margin-top:4px;font-weight:600;letter-spacing:0.02em;}
        .blocked-banner {
            align-self: center;
            background: rgba(244, 63, 94, 0.1);
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: #f43f5e;
            padding: 12px 20px;
            border-radius: 14px;
            font-size: 0.82rem;
            font-weight: 700;
            text-align: center;
            margin: 8px 0;
            max-width: 90%;
        }
        .blocked-banner i { margin-right: 6px; }
        .chat-input-area{
            padding:10px 14px;padding-bottom:max(10px, var(--safe-bottom));padding-left:max(14px, var(--safe-left));padding-right:max(14px, var(--safe-right));
            background:rgba(22,22,30,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
            display:flex;align-items:center;gap:8px;flex-shrink:0;border-top:1px solid var(--border);
        }
        .chat-input{
            flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:12px 18px;
            border-radius:24px;outline:none;font-size:16px;min-width:0;font-weight:500;transition:all 0.2s;
            -webkit-appearance:none;appearance:none;
        }
        .chat-input:focus{border-color:var(--primary);background:rgba(139,92,246,0.05);box-shadow:0 0 0 3px rgba(139,92,246,0.15);}
        .chat-input::placeholder{color:var(--text-muted);}
        .chat-input:disabled { opacity: 0.5; cursor: not-allowed; }
        .send-btn{
            width:46px;height:46px;min-width:46px;background:var(--gradient);border:none;border-radius:50%;color:#fff;font-size:1rem;
            display:flex;align-items:center;justify-content:center;cursor:pointer;
            box-shadow:0 4px 12px rgba(139,92,246,0.4);
            transition:transform 0.15s cubic-bezier(0.4,0,0.2,1), box-shadow 0.2s;
        }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .typing-indicator{font-size:0.72rem;font-weight:600;color:var(--primary-2);font-style:italic;height:20px;padding:0 20px;padding-left:max(20px, var(--safe-left));padding-right:max(20px, var(--safe-right));line-height:20px;flex-shrink:0;letter-spacing:0.01em;}

        /* Side menu */
        .side-menu{
            position:absolute;top:0;left:-100%;width:82%;max-width:340px;height:100%;
            background:rgba(22,22,30,0.98);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);z-index:40;
            transition:left 0.32s cubic-bezier(0.4,0,0.2,1);padding:24px 20px;padding-top:max(24px, var(--safe-top));
            padding-left:max(20px, var(--safe-left));padding-bottom:max(24px, var(--safe-bottom));
            display:flex;flex-direction:column;box-shadow:4px 0 40px rgba(0,0,0,0.7);border-right:1px solid var(--border);
            overflow-y:auto;
        }
        .side-menu.open{left:0;}
        .menu-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.65);z-index:35;display:none;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
        .menu-overlay.open{display:block;animation:fadeIn 0.2s;}
        @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
        .profile-card{text-align:center;margin-bottom:24px;padding:24px 16px;background:var(--gradient-soft);border-radius:20px;border:1px solid rgba(139,92,246,0.2);}
        .profile-card img{width:88px;height:88px;margin-bottom:12px;border-radius:24px;border:2px solid rgba(139,92,246,0.4);box-shadow:0 8px 24px rgba(139,92,246,0.3);}

        /* Modals */
        .modal{
            position:absolute;top:0;left:0;right:0;bottom:0;background:#0f0f16;z-index:50;display:none;flex-direction:column;
            padding:24px 20px;padding-top:max(24px, var(--safe-top));padding-bottom:max(24px, var(--safe-bottom));
            padding-left:max(20px, var(--safe-left));padding-right:max(20px, var(--safe-right));
            overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
        }
        .modal.active{display:flex;animation:modalIn 0.3s cubic-bezier(0.4,0,0.2,1);}
        @keyframes modalIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-shrink:0;}
        .modal-header h2{font-size:clamp(1.15rem, 4.5vw, 1.35rem);font-weight:800;letter-spacing:-0.02em;background:var(--gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}

        /* Forms */
        .form-group{margin-bottom:18px;}
        .form-group label{display:block;font-size:0.78rem;color:var(--text-secondary);margin-bottom:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;}
        .form-input{
            width:100%;padding:14px 16px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
            border-radius:14px;outline:none;font-size:16px;font-weight:500;transition:all 0.2s;
            -webkit-appearance:none;appearance:none;
        }
        .form-input:focus{border-color:var(--primary);background:rgba(139,92,246,0.05);box-shadow:0 0 0 3px rgba(139,92,246,0.15);}
        .form-input::placeholder{color:var(--text-muted);}

        /* Buttons */
        .btn{
            width:100%;padding:15px;background:var(--gradient);color:#fff;border:none;border-radius:14px;
            font-weight:700;cursor:pointer;font-size:clamp(0.88rem, 3.2vw, 0.95rem);margin-top:8px;min-height:52px;
            transition:transform 0.15s cubic-bezier(0.4,0,0.2,1), box-shadow 0.2s;
            box-shadow:0 6px 20px rgba(139,92,246,0.3);letter-spacing:0.01em;font-family:inherit;
            -webkit-user-select:none;user-select:none;-webkit-appearance:none;appearance:none;
        }
        .btn-secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border);box-shadow:none;}
        .btn-danger{background:var(--danger);box-shadow:0 6px 20px rgba(244,63,94,0.3);}

    function emojiToSVG(content) {
        const text = (content || "BS").substring(0, 2);
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#g)"/><text x="50%" y="55%" font-size="45" dominant-baseline="middle" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="bold">${text}</text></svg>`;
        return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
    }

    async function initiateCall(type) {
        if (iBlockedThem) { showToast('Unblock user to call', 'danger'); haptic(30); return; }
        if (theyBlockedMe) { showToast('Cannot call this user', 'danger'); haptic(30); return; }
        callType = type; isCaller = true;
        currentCallPeerId = activeChatUserId;
        currentCallId = getChatId(currentUser.uid, activeChatUserId);
        setupCallUI(type, activeChatUserId);
        showModal('call-screen');
        try {
            localStream = await navigator.mediaDevices.getUserMedia({
                audio: AUDIO_CONSTRAINTS,
                video: type === 'video' ? HQ_VIDEO : false
            });
        } catch (err) { alert("Could not access camera/microphone."); hideModal('call-screen'); return; }
        document.getElementById('localVideo').srcObject = localStream;
        pc = new RTCPeerConnection(rtcConfig);
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
        await boostAudioBitrate(pc);
        pc.ontrack = (event) => {
            const rv = document.getElementById('remoteVideo');
            rv.srcObject = event.streams[0];
            rv.play().catch(e => console.log("Autoplay blocked:", e));
            killJitterBuffer(pc);
        };
        const callRef = ref(db, `calls/${currentCallId}`);
        const candidatesRef = child(callRef, 'callerCandidates');
        pc.onicecandidate = (e) => { if (e.candidate) push(candidatesRef, e.candidate.toJSON()); };
        const offer = await pc.createOffer();
        offer.sdp = tuneOpusSDP(offer.sdp);
        await pc.setLocalDescription(offer);
        await set(callRef, {
            type: callType, caller: currentUser.uid, receiver: activeChatUserId,
            offer: { type: offer.type, sdp: offer.sdp }, status: 'calling'
        });
        onValue(child(callRef, 'answer'), async (s) => {
            const answer = s.val();
            if (answer && pc && !pc.currentRemoteDescription) {
                try {
                    await pc.setRemoteDescription(new RTCSessionDescription(answer));
                    callStartTime = Date.now();
                    document.getElementById('call-status').textContent = 'Connected';
                    killJitterBuffer(pc);
                } catch(e) { console.error(e); }
            }
        });
        onValue(child(callRef, 'calleeCandidates'), (s) => {
            s.forEach(c => { try { pc.addIceCandidate(new RTCIceCandidate(c.val())); } catch(e){} });
        });
        onValue(child(callRef, 'status'), (s) => {
            if (s.val() === 'ended' || s.val() === 'rejected') cleanUpCall();
        });
    }

    function listenForCallsIncoming() {
        const q = query(ref(db, 'calls'), orderByChild('receiver'), equalTo(currentUser.uid));
        onValue(q, async (snap) => {
            const calls = snap.val();
            if (!calls) return;
            Object.keys(calls).forEach(async (cId) => {
                const call = calls[cId];
                if (call.status === 'calling' && !currentCallId) {
                    // ✅ Check if caller is blocked
                    const blockSnap = await get(ref(db, `blocks/${currentUser.uid}/${call.caller}`));
                    if (blockSnap.exists()) {
                        // Auto-reject blocked caller
                        await update(ref(db, `calls/${cId}`), { status: 'rejected' });
                        setTimeout(() => remove(ref(db, `calls/${cId}`)), 2000);
                        return;
                    }
                    currentCallId = cId; currentCallPeerId = call.caller; callType = call.type;
                    const callerData = (await get(ref(db, `users/${call.caller}`))).val();
                    document.getElementById('incoming-caller-name').textContent = callerData.name;
                    document.getElementById('incoming-caller-dp').src = callerData.dpUrl;
                    document.getElementById('incoming-call-type').textContent = `Incoming ${call.type.toUpperCase()} call...`;
                    startRingtone();
                    showModal('incoming-call-modal');
                    haptic([100, 50, 100, 50, 100]);
                }
            });
        });
    }

    document.getElementById('accept-call-btn').addEventListener('click', async () => {
        stopRingtone(); hideModal('incoming-call-modal'); showModal('call-screen');
        const call = (await get(ref(db, `calls/${currentCallId}`))).val();
        setupCallUI(call.type, call.caller);
        try {
            localStream = await navigator.mediaDevices.getUserMedia({
                audio: AUDIO_CONSTRAINTS,
                video: call.type === 'video' ? HQ_VIDEO : false
            });
        } catch (err) { alert("Could not access camera/microphone."); return; }
        document.getElementById('localVideo').srcObject = localStream;
        pc = new RTCPeerConnection(rtcConfig);
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
        await boostAudioBitrate(pc);
        pc.ontrack = (event) => {
            const rv = document.getElementById('remoteVideo');
            rv.srcObject = event.streams[0];
            rv.play().catch(e => console.log("Autoplay blocked:", e));
            killJitterBuffer(pc);
        };
        const callRef = ref(db, `calls/${currentCallId}`);
        const calleeCandidatesRef = child(callRef, 'calleeCandidates');
        pc.onicecandidate = (e) => { if (e.candidate) push(calleeCandidatesRef, e.candidate.toJSON()); };
        try {
            await pc.setRemoteDescription(new RTCSessionDescription(call.offer));
            const answer = await pc.createAnswer();
            answer.sdp = tuneOpusSDP(answer.sdp);
            await pc.setLocalDescription(answer);
            await update(callRef, { answer: { type: answer.type, sdp: answer.sdp }, status: 'connected' });
            callStartTime = Date.now();
            document.getElementById('call-status').textContent = 'Connected';
            killJitterBuffer(pc);
            onValue(child(callRef, 'callerCandidates'), (s) => {
                s.forEach(c => { try { pc.addIceCandidate(new RTCIceCandidate(c.val())); } catch(e){} });
            });
            onValue(child(callRef, 'status'), (s) => { if (s.val() === 'ended') cleanUpCall(); });
        } catch(e) { console.error(e); cleanUpCall(); }
    });

    document.getElementById('reject-call-btn').addEventListener('click', async () => {
        stopRingtone(); hideModal('incoming-call-modal');
        if (currentCallId) {
            await update(ref(db, `calls/${currentCallId}`), { status: 'rejected' });
            logCall('missed', 0, currentCallPeerId);
            remove(ref(db, `calls/${currentCallId}`));
            currentCallId = null; currentCallPeerId = null;
        }
    });

    async function setupCallUI(type, otherUid) {
        const uData = (await get(ref(db, `users/${otherUid}`))).val();
        if (type === 'video') {
            document.getElementById('video-container').style.display = 'block';
            document.getElementById('voice-call-ui').style.display = 'none';
        } else {
            document.getElementById('video-container').style.display = 'none';
            document.getElementById('voice-call-ui').style.display = 'flex';
            document.getElementById('call-user-dp').src = uData.dpUrl;
            document.getElementById('call-user-name').textContent = uData.name;
            document.getElementById('call-status').textContent = 'Ringing...';
        }
    }

    document.getElementById('toggle-audio-btn').addEventListener('click', () => {
        if (localStream && localStream.getAudioTracks().length > 0) {
            isMuted = !isMuted;
            localStream.getAudioTracks()[0].enabled = !isMuted;
            document.getElementById('toggle-audio-btn').style.background = isMuted ? 'var(--danger)' : 'var(--surface-2)';
            haptic(15);
        }
    });

    document.getElementById('end-call-btn').addEventListener('click', async () => {
        if (currentCallId) {
            await update(ref(db, `calls/${currentCallId}`), { status: 'ended' });
            cleanUpCall();
        }
    });

    function cleanUpCall() {
        stopRingtone();
        const duration = callStartTime ? Math.round((Date.now() - callStartTime) / 1000) : 0;
        if (currentCallId) {
            if (callStartTime || isCaller) logCall(duration > 0 ? callType : 'missed', duration, currentCallPeerId);
            remove(ref(db, `calls/${currentCallId}`));
        }
        if (pc) { pc.close(); pc = null; }
        if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
        hideModal('call-screen'); hideModal('incoming-call-modal');
        callStartTime = null; currentCallId = null; currentCallPeerId = null; isCaller = false; isMuted = false;
        document.getElementById('toggle-audio-btn').style.background = 'var(--surface-2)';
    }

    async function logCall(type, duration, peerId) {
        if (!peerId) return;
        await push(ref(db, `callLogs/${currentUser.uid}`), { type, duration, timestamp: serverTimestamp(), peer: peerId });
    }

    function listenForCallLogs() {
        onValue(ref(db, `callLogs/${currentUser.uid}`), async (snap) => {
            const container = document.getElementById('calls-list');
            container.innerHTML = '';
            const logs = snap.val();
            if (!logs) { container.innerHTML = '<div class="empty-state">No call history</div>'; return; }
            for (let k of Object.keys(logs).reverse()) {
                const log = logs[k];
                const pData = (await get(ref(db, `users/${log.peer}`))).val() || { name: 'Unknown', dpUrl: emojiToSVG('?') };
                const item = document.createElement('div');
                item.className = 'list-item';
                const t = log.timestamp ? new Date(log.timestamp).toLocaleString() : '';
                const icon = log.type === 'missed' ? '<i class="fa-solid fa-phone-slash" style="color:var(--danger);font-size:0.75rem;"></i> ' : '<i class="fa-solid fa-phone" style="color:var(--success);font-size:0.75rem;"></i> ';
                item.innerHTML = `<img src="${pData.dpUrl}" class="avatar"><div class="list-details"><div class="list-title">${pData.name}</div><div class="list-subtitle">${icon}${log.type.toUpperCase()} • ${log.duration}s • ${t}</div></div>`;
                container.appendChild(item);
            }
        });
    }

    const localVideoEl = document.getElementById("localVideo");
    let isDragging = false, currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;
    localVideoEl.addEventListener("touchstart", dragStart, { passive: false });
    localVideoEl.addEventListener("touchend", dragEnd);
    localVideoEl.addEventListener("touchmove", drag, { passive: false });
    localVideoEl.addEventListener("mousedown", dragStart);
    localVideoEl.addEventListener("mouseup", dragEnd);
    localVideoEl.addEventListener("mousemove", drag);
    function dragStart(e) {
        initialX = (e.type === "touchstart" ? e.touches[0].clientX : e.clientX) - xOffset;
        initialY = (e.type === "touchstart" ? e.touches[0].clientY : e.clientY) - yOffset;
        if (e.target === localVideoEl) { isDragging = true; localVideoEl.style.cursor = 'grabbing'; }
    }
    function dragEnd() { initialX = currentX; initialY = currentY; isDragging = false; localVideoEl.style.cursor = 'grab'; }
    function drag(e) {
        if (isDragging) {
            e.preventDefault();
            currentX = (e.type === "touchmove" ? e.touches[0].clientX : e.clientX) - initialX;
            currentY = (e.type === "touchmove" ? e.touches[0].clientY : e.clientY) - initialY;
            xOffset = currentX; yOffset = currentY;
            localVideoEl.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
        }
    }

    function setVH() {
        const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        document.documentElement.style.setProperty('--vh', vh + 'px');
    }
    setVH();
    window.addEventListener('resize', setVH);
    window.addEventListener('orientationchange', () => setTimeout(setVH, 100));

    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', () => {
            const appContainer = document.getElementById('app-container');
            if (window.visualViewport.height < window.innerHeight - 150) {
                appContainer.style.height = window.visualViewport.height + 'px';
                setTimeout(() => {
                    const activeEl = document.activeElement;
                    if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA')) {
                        activeEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
                    }
                }, 100);
            } else {
                appContainer.style.height = '';
            }
        });
    }

    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) e.preventDefault();
        lastTouchEnd = now;
    }, { passive: false });

    document.body.addEventListener('touchmove', (e) => {
        if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });
</script>
</body>
</html>
