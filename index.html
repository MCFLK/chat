
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ar Chats</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tone.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <style>
        :root {
            --primary-color: #00A878;
            --background-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --bubble-bg-me: #00A878;
            --bubble-text-me: #121212;
            --bubble-bg-other: #2c2c2c;
            --bubble-text-other: #e0e0e0;
            --secondary-text: #a0a0a0;
            --danger-color: #ff5252;
            --border-color: #2a2a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Mobile Simulation Container */
        #app-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 800px;
            background-color: var(--background-color);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border-radius: 12px;
        }

        /* Header */
        header {
            background-color: var(--container-bg);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
            height: 60px;
        }

        header h1 {
            font-size: 1.2rem;
            color: var(--primary-color);
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px;
        }

        /* Avatar Styling */
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background: #000;
        }

        .avatar-sm {
            width: 32px;
            height: 32px;
        }

        /* Main Content Views */
        main {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .view {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: none;
            flex-direction: column;
            background-color: var(--background-color);
            overflow-y: auto;
        }

        .view.active {
            display: flex;
        }

        /* Bottom Navigation */
        nav {
            background-color: var(--container-bg);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid var(--border-color);
            z-index: 10;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--secondary-text);
            text-decoration: none;
            font-size: 0.75rem;
            gap: 4px;
            cursor: pointer;
            position: relative;
            background: none;
            border: none;
            width: 33.33%;
        }

        .nav-item.active {
            color: var(--primary-color);
        }

        .nav-item i {
            font-size: 1.2rem;
        }

        .badge {
            position: absolute;
            top: -2px;
            right: 25%;
            background-color: var(--primary-color);
            color: #000;
            font-size: 0.65rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 10px;
        }

        /* Lists (Contacts, Requests, Calls) */
        .list-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
        }

        .list-item:active {
            background-color: var(--container-bg);
        }

        .list-details {
            margin-left: 12px;
            flex: 1;
            overflow: hidden;
        }

        .list-title {
            font-weight: 500;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
        }

        .list-subtitle {
            font-size: 0.8rem;
            color: var(--secondary-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
        }
        .status-dot.online { background-color: var(--primary-color); }
        .status-dot.offline { background-color: var(--secondary-text); }

        /* Chat View Overlay */
        #chat-view {
            z-index: 20;
            background-color: var(--background-color);
        }

        .chat-header {
            background-color: var(--container-bg);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message-bubble {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.9rem;
            word-wrap: break-word;
            position: relative;
        }

        .message-bubble.me {
            align-self: flex-end;
            background-color: var(--bubble-bg-me);
            color: var(--bubble-text-me);
            border-bottom-right-radius: 2px;
        }

        .message-bubble.other {
            align-self: flex-start;
            background-color: var(--bubble-bg-other);
            color: var(--bubble-text-other);
            border-bottom-left-radius: 2px;
        }

        .message-time {
            font-size: 0.65rem;
            opacity: 0.7;
            text-align: right;
            margin-top: 4px;
        }

        .chat-input-area {
            padding: 10px 16px;
            background-color: var(--container-bg);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-input {
            flex: 1;
            background-color: var(--background-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 14px;
            border-radius: 20px;
            outline: none;
        }

        .typing-indicator {
            font-size: 0.75rem;
            color: var(--primary-color);
            font-style: italic;
            height: 16px;
            padding: 0 16px;
        }

        /* Slide-Out Side Menu */
        .side-menu {
            position: absolute;
            top: 0; left: -100%;
            width: 80%; height: 100%;
            background-color: var(--container-bg);
            z-index: 40;
            transition: left 0.3s ease;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
        }

        .side-menu.open {
            left: 0;
        }

        .menu-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 35;
            display: none;
        }

        .menu-overlay.open {
            display: block;
        }

        .profile-card {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-card img {
            width: 80px; height: 80px;
            margin-bottom: 10px;
        }

        /* Modals */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--background-color);
            z-index: 50;
            display: none;
            flex-direction: column;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        /* Forms & Inputs */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--secondary-text);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            outline: none;
            font-size: 0.9rem;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: #121212;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            margin-top: 8px;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: #fff;
        }

        /* WebRTC Call UI */
        #call-screen {
            background-color: #000;
            z-index: 60;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
        }

        .video-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
        }

        #remoteVideo {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        #localVideo {
            position: absolute;
            top: 20px; right: 20px;
            width: 100px; height: 150px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid var(--primary-color);
            z-index: 61;
            cursor: move;
            background: #222;
        }

        #voice-call-ui {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 61;
            margin-top: 60px;
        }

        #voice-call-ui img {
            width: 120px; height: 120px;
            border-radius: 50%;
            margin-bottom: 20px;
            border: 3px solid var(--primary-color);
        }

        .call-controls {
            z-index: 62;
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .btn-call-action {
            width: 60px; height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.4rem;
            border: none;
            cursor: pointer;
        }

        .action-btns-row {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.8rem;
            width: auto;
        }
    </style>
</head>
<body>

<div id="app-container">
    <!-- Overlay for Side Menu -->
    <div class="menu-overlay" id="menu-overlay"></div>

    <!-- Side Menu -->
    <div class="side-menu" id="side-menu">
        <div class="profile-card">
            <img id="menu-dp" src="" class="avatar" alt="DP">
            <h2 id="menu-name">User Name</h2>
            <p id="menu-id" style="color: var(--primary-color); font-size: 0.85rem; margin-top: 2px;"></p>
            <p id="menu-bio" style="color: var(--secondary-text); font-size: 0.8rem; margin-top: 6px;"></p>
        </div>
        <button class="btn btn-secondary" id="edit-profile-btn" style="margin-bottom: 10px;"><i class="fa-solid fa-pen"></i> Edit Profile</button>
        <button class="btn btn-danger" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </div>

    <!-- Header -->
    <header id="main-header">
        <div style="display: flex; align-items: center; gap: 10px;">
            <button class="icon-btn" id="open-menu-btn"><i class="fa-solid fa-bars"></i></button>
            <h1>Ar Chats</h1>
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="add-friend-btn"><i class="fa-solid fa-user-plus"></i></button>
        </div>
    </header>

    <!-- Main Navigation Views -->
    <main>
        <!-- Contacts / Chat List -->
        <div class="view active" id="view-chats">
            <div id="contacts-list"></div>
        </div>

        <!-- Friend Requests -->
        <div class="view" id="view-requests">
            <div id="requests-list"></div>
        </div>

        <!-- Call Logs -->
        <div class="view" id="view-calls">
            <div id="calls-list"></div>
        </div>

        <!-- Dedicated Chat View (Overlay View) -->
        <div class="view" id="chat-view">
            <div class="chat-header">
                <button class="icon-btn" id="close-chat-btn"><i class="fa-solid fa-arrow-left"></i></button>
                <img id="chat-header-dp" src="" class="avatar avatar-sm" alt="DP">
                <div style="flex: 1; overflow: hidden;">
                    <div id="chat-header-name" style="font-weight: 600; font-size: 0.95rem;">Name</div>
                    <div id="chat-header-status" style="font-size: 0.7rem; color: var(--secondary-text);">Offline</div>
                </div>
                <div class="action-btns-row">
                    <button class="icon-btn" id="voice-call-btn" style="color: var(--primary-color);"><i class="fa-solid fa-phone"></i></button>
                    <button class="icon-btn" id="video-call-btn" style="color: var(--primary-color);"><i class="fa-solid fa-video"></i></button>
                    <button class="icon-btn" id="clear-chat-btn"><i class="fa-solid fa-trash"></i></button>
                </div>
            </div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="typing-indicator" id="typing-indicator"></div>
            <div class="chat-input-area">
                <input type="text" class="chat-input" id="message-input" placeholder="Type a message...">
                <button class="icon-btn" id="send-btn" style="color: var(--primary-color); font-size: 1.4rem;"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav id="bottom-nav">
        <button class="nav-item active" data-target="view-chats">
            <i class="fa-solid fa-comment-dots"></i>
            <span>Chats</span>
        </button>
        <button class="nav-item" data-target="view-requests">
            <i class="fa-solid fa-user-clock"></i>
            <span>Requests</span>
            <span class="badge" id="requests-badge" style="display: none;">0</span>
        </button>
        <button class="nav-item" data-target="view-calls">
            <i class="fa-solid fa-phone-flip"></i>
            <span>Calls</span>
        </button>
    </nav>
</div>

<!-- Authentication Modal -->
<div class="modal active" id="auth-modal">
    <div style="text-align: center; margin-top: 40px; margin-bottom: 30px;">
        <h1 style="color: var(--primary-color); font-size: 2rem;">Ar Chats</h1>
        <p style="color: var(--secondary-text); font-size: 0.85rem;">Real-time Secure Messaging</p>
    </div>
    <div id="auth-forms">
        <div class="form-group">
            <label>Email</label>
            <input type="email" class="form-input" id="auth-email" placeholder="enter email">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" class="form-input" id="auth-password" placeholder="enter password">
        </div>
        <button class="btn" id="login-btn">Log In</button>
        <button class="btn btn-secondary" id="signup-btn">Sign Up</button>
    </div>
</div>

<!-- Profile Setup / Edit Modal -->
<div class="modal" id="profile-modal">
    <div class="modal-header">
        <h2>Setup Profile</h2>
    </div>
    <div class="form-group">
        <label>Display Name (max 20 chars)</label>
        <input type="text" class="form-input" id="profile-name" maxlength="20" placeholder="John Doe">
    </div>
    <div class="form-group">
        <label>Bio (max 100 chars)</label>
        <input type="text" class="form-input" id="profile-bio" maxlength="100" placeholder="Hey there! I am using Ar Chats.">
    </div>
    <div class="form-group">
        <label>Identifier / Emoji (max 2 chars)</label>
        <input type="text" class="form-input" id="profile-emoji" maxlength="2" placeholder="😎">
    </div>
    <div style="text-align: center; margin: 20px 0;">
        <p style="font-size: 0.8rem; color: var(--secondary-text); margin-bottom: 8px;">Generated Avatar Preview:</p>
        <img id="profile-preview-dp" class="avatar" style="width: 64px; height: 64px;" src="" alt="Preview">
    </div>
    <button class="btn" id="save-profile-btn">Save & Continue</button>
</div>

<!-- Add Friend Modal -->
<div class="modal" id="add-friend-modal">
    <div class="modal-header">
        <h2>Add Friend</h2>
        <button class="icon-btn" id="close-add-friend-btn"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="form-group">
        <label>User ID (e.g. ar-1234)</label>
        <input type="text" class="form-input" id="search-user-id" placeholder="ar-xxxx">
    </div>
    <button class="btn" id="search-user-btn">Search & Request</button>
    <div id="search-result" style="margin-top: 20px;"></div>
</div>

<!-- Incoming Call Overlay Modal -->
<div class="modal" id="incoming-call-modal" style="justify-content: center; align-items: center; z-index: 55;">
    <img id="incoming-caller-dp" class="avatar" style="width: 100px; height: 100px; margin-bottom: 16px;" src="" alt="Caller">
    <h2 id="incoming-caller-name">Caller Name</h2>
    <p id="incoming-call-type" style="color: var(--secondary-text); margin-bottom: 40px;">Incoming Voice Call...</p>
    <div style="display: flex; gap: 30px;">
        <button class="btn-call-action" id="accept-call-btn" style="background-color: var(--primary-color); color: #000;"><i class="fa-solid fa-phone"></i></button>
        <button class="btn-call-action" id="reject-call-btn" style="background-color: var(--danger-color); color: #fff;"><i class="fa-solid fa-phone-slash"></i></button>
    </div>
</div>

<!-- WebRTC Call Screen Modal -->
<div class="modal" id="call-screen">
    <div class="video-container" id="video-container">
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div id="voice-call-ui" style="display: none;">
        <img id="call-user-dp" src="" alt="User">
        <h2 id="call-user-name">User Name</h2>
        <p id="call-status" style="color: var(--primary-color); margin-top: 8px;">Connected</p>
    </div>
    <div style="flex:1;"></div>
    <div class="call-controls">
        <button class="btn-call-action" id="toggle-audio-btn" style="background-color: var(--container-bg); color: #fff;"><i class="fa-solid fa-microphone"></i></button>
        <button class="btn-call-action" id="end-call-btn" style="background-color: var(--danger-color); color: #fff;"><i class="fa-solid fa-phone-slash"></i></button>
    </div>
</div>

<!-- Firebase Modular App Logic -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { 
        getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { 
        getDatabase, ref, set, get, child, onValue, push, update, remove, onDisconnect, serverTimestamp, query, orderByChild, equalTo 
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    // --- Firebase Configuration ---
    const firebaseConfig = {
        apiKey: "AIzaSyCsTasTcFUTfVDlREZUvI3AnKB6A75hpT4",
        authDomain: "chat-3f0db.firebaseapp.com",
        databaseURL: "https://chat-3f0db-default-rtdb.firebaseio.com",
        projectId: "chat-3f0db",
        storageBucket: "chat-3f0db.firebasestorage.app",
        messagingSenderId: "583034818044",
        appId: "1:583034818044:web:5bd4b1bf2c5e2c8651f679"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // --- Global Application State ---
    let currentUser = null;
    let currentUserData = null;
    let activeChatUserId = null;
    let activeChatId = null;
    let typingTimeout = null;
    let pc = null; // RTCPeerConnection instance
    let localStream = null;
    let currentCallId = null;
    let callType = null; // 'voice' or 'video'
    let isCaller = false;
    let callStartTime = null;
    let isMuted = false;

    // WebRTC STUN Servers
    const rtcConfig = {
        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    };

    // --- Tone.js Ringtone Synthesis ---
    let ringtoneSynth = null;
    let ringtoneLoop = null;

    function initRingtone() {
        if (!ringtoneSynth) {
            ringtoneSynth = new Tone.Synth().toDestination();
            ringtoneLoop = new Tone.Loop(time => {
                ringtoneSynth.triggerAttackRelease("C5", "8n", time);
                ringtoneSynth.triggerAttackRelease("E5", "8n", time + 0.2);
            }, "1s");
        }
    }

    function startRingtone() {
        try {
            Tone.start();
            initRingtone();
            Tone.Transport.start();
            ringtoneLoop.start(0);
        } catch (e) {
            console.error("Audio Play Error:", e);
        }
    }

    function stopRingtone() {
        if (ringtoneLoop) {
            ringtoneLoop.stop();
            Tone.Transport.stop();
        }
    }

    // --- SVG Data URL Avatar Generator ---
    function emojiToSVG(content) {
        const text = (content || "AR").substring(0, 2);
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
            <rect width="100%" height="100%" fill="#000000"/>
            <text x="50%" y="55%" font-size="45" dominant-baseline="middle" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif">${text}</text>
        </svg>`;
        return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
    }

    // --- Helper UI Functions ---
    function showModal(id) { document.getElementById(id).classList.add('active'); }
    function hideModal(id) { document.getElementById(id).classList.remove('active'); }

    // Navigation Switcher
    document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', () => {
            const target = btn.getAttribute('data-target');
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(target).classList.add('active');
        });
    });

    // Side Menu Controls
    document.getElementById('open-menu-btn').addEventListener('click', () => {
        document.getElementById('side-menu').classList.add('open');
        document.getElementById('menu-overlay').classList.add('open');
    });

    function closeSideMenu() {
        document.getElementById('side-menu').classList.remove('open');
        document.getElementById('menu-overlay').classList.remove('open');
    }
    document.getElementById('menu-overlay').addEventListener('click', closeSideMenu);

    // Profile Input Realtime Preview
    document.getElementById('profile-emoji').addEventListener('input', (e) => {
        document.getElementById('profile-preview-dp').src = emojiToSVG(e.target.value);
    });

    // --- Authentication Flow ---
    document.getElementById('login-btn').addEventListener('click', () => {
        const email = document.getElementById('auth-email').value;
        const pass = document.getElementById('auth-password').value;
        signInWithEmailAndPassword(auth, email, pass).catch(err => alert(err.message));
    });

    document.getElementById('signup-btn').addEventListener('click', () => {
        const email = document.getElementById('auth-email').value;
        const pass = document.getElementById('auth-password').value;
        createUserWithEmailAndPassword(auth, email, pass).catch(err => alert(err.message));
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
        signOut(auth).then(() => {
            closeSideMenu();
            location.reload();
        });
    });

    // Auth State Changed Observer
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            hideModal('auth-modal');
            
            // Check Profile Existence
            const snap = await get(ref(db, `users/${user.uid}`));
            if (!snap.exists()) {
                showModal('profile-modal');
            } else {
                currentUserData = snap.val();
                initPresence();
                loadUserDataUI();
                listenForContacts();
                listenForRequests();
                listenForCallsIncoming();
                listenForCallLogs();
            }
        } else {
            showModal('auth-modal');
        }
    });

    // --- Profile Creation / Saving ---
    document.getElementById('save-profile-btn').addEventListener('click', async () => {
        const name = document.getElementById('profile-name').value.trim();
        const bio = document.getElementById('profile-bio').value.trim();
        const emoji = document.getElementById('profile-emoji').value.trim() || '💬';

        if (!name) return alert('Name is required');

        const userIdTag = 'ar-' + Math.floor(1000 + Math.random() * 9000);
        const dpUrl = emojiToSVG(emoji);

        const profileData = {
            uid: currentUser.uid,
            name: name,
            bio: bio,
            emoji: emoji,
            userId: userIdTag,
            dpUrl: dpUrl
        };

        await set(ref(db, `users/${currentUser.uid}`), profileData);
        await set(ref(db, `userIndex/${userIdTag}`), currentUser.uid);

        currentUserData = profileData;
        hideModal('profile-modal');
        initPresence();
        loadUserDataUI();
        listenForContacts();
        listenForRequests();
        listenForCallsIncoming();
        listenForCallLogs();
    });

    document.getElementById('edit-profile-btn').addEventListener('click', () => {
        closeSideMenu();
        if (currentUserData) {
            document.getElementById('profile-name').value = currentUserData.name || '';
            document.getElementById('profile-bio').value = currentUserData.bio || '';
            document.getElementById('profile-emoji').value = currentUserData.emoji || '';
            document.getElementById('profile-preview-dp').src = currentUserData.dpUrl || emojiToSVG('');
        }
        showModal('profile-modal');
    });

    function loadUserDataUI() {
        document.getElementById('menu-dp').src = currentUserData.dpUrl;
        document.getElementById('menu-name').textContent = currentUserData.name;
        document.getElementById('menu-id').textContent = currentUserData.userId;
        document.getElementById('menu-bio').textContent = currentUserData.bio || 'No bio set';
    }

    // --- Presence System ---
    function initPresence() {
        const myStatusRef = ref(db, `status/${currentUser.uid}`);
        const connectedRef = ref(db, '.info/connected');

        onValue(connectedRef, (snap) => {
            if (snap.val() === true) {
                onDisconnect(myStatusRef).set({
                    state: 'offline',
                    last_changed: serverTimestamp()
                }).then(() => {
                    set(myStatusRef, {
                        state: 'online',
                        last_changed: serverTimestamp()
                    });
                });
            }
        });
    }

    // --- Friend Requests & Search ---
    document.getElementById('add-friend-btn').addEventListener('click', () => showModal('add-friend-modal'));
    document.getElementById('close-add-friend-btn').addEventListener('click', () => hideModal('add-friend-modal'));

    document.getElementById('search-user-btn').addEventListener('click', async () => {
        const queryId = document.getElementById('search-user-id').value.trim();
        const resDiv = document.getElementById('search-result');
        resDiv.innerHTML = '';

        if (!queryId) return;

        const snap = await get(ref(db, `userIndex/${queryId}`));
        if (snap.exists()) {
            const targetUid = snap.val();
            if (targetUid === currentUser.uid) {
                resDiv.innerHTML = '<p style="color:var(--danger-color)">Cannot add yourself.</p>';
                return;
            }
            const userSnap = await get(ref(db, `users/${targetUid}`));
            const targetData = userSnap.val();

            resDiv.innerHTML = `
                <div class="list-item">
                    <img src="${targetData.dpUrl}" class="avatar">
                    <div class="list-details">
                        <div class="list-title">${targetData.name}</div>
                        <div class="list-subtitle">${targetData.userId}</div>
                    </div>
                    <button class="btn btn-sm" id="send-req-btn">Send Request</button>
                </div>
            `;

            document.getElementById('send-req-btn').addEventListener('click', async () => {
                await set(ref(db, `requests/${targetUid}/${currentUser.uid}`), {
                    from: currentUser.uid,
                    status: 'pending',
                    timestamp: serverTimestamp()
                });
                alert('Request sent!');
                hideModal('add-friend-modal');
            });

        } else {
            resDiv.innerHTML = '<p style="color:var(--secondary-text)">User not found.</p>';
        }
    });

    function listenForRequests() {
        onValue(ref(db, `requests/${currentUser.uid}`), async (snap) => {
            const reqs = snap.val();
            const container = document.getElementById('requests-list');
            const badge = document.getElementById('requests-badge');
            container.innerHTML = '';

            if (!reqs) {
                badge.style.display = 'none';
                container.innerHTML = '<p style="padding:16px; color:var(--secondary-text)">No pending requests.</p>';
                return;
            }

            const reqKeys = Object.keys(reqs);
            badge.textContent = reqKeys.length;
            badge.style.display = reqKeys.length > 0 ? 'inline-block' : 'none';

            for (let fromUid of reqKeys) {
                const uSnap = await get(ref(db, `users/${fromUid}`));
                const uData = uSnap.val();

                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <img src="${uData.dpUrl}" class="avatar">
                    <div class="list-details">
                        <div class="list-title">${uData.name}</div>
                        <div class="list-subtitle">${uData.userId}</div>
                    </div>
                    <div class="action-btns-row">
                        <button class="btn btn-sm accept-btn"><i class="fa-solid fa-check"></i></button>
                        <button class="btn btn-sm btn-danger reject-btn"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                `;

                div.querySelector('.accept-btn').addEventListener('click', async () => {
                    await set(ref(db, `contacts/${currentUser.uid}/${fromUid}`), true);
                    await set(ref(db, `contacts/${fromUid}/${currentUser.uid}`), true);
                    await remove(ref(db, `requests/${currentUser.uid}/${fromUid}`));
                });

                div.querySelector('.reject-btn').addEventListener('click', async () => {
                    await remove(ref(db, `requests/${currentUser.uid}/${fromUid}`));
                });

                container.appendChild(div);
            }
        });
    }

    // --- Contacts & Active Chat Helpers ---
    function getChatId(uid1, uid2) {
        return uid1 < uid2 ? `${uid1}_${uid2}` : `${uid2}_${uid1}`;
    }

    function listenForContacts() {
        onValue(ref(db, `contacts/${currentUser.uid}`), async (snap) => {
            const contacts = snap.val();
            const container = document.getElementById('contacts-list');
            container.innerHTML = '';

            if (!contacts) {
                container.innerHTML = '<p style="padding:16px; color:var(--secondary-text)">No contacts yet. Add friends using their ID!</p>';
                return;
            }

            for (let friendUid of Object.keys(contacts)) {
                const uSnap = await get(ref(db, `users/${friendUid}`));
                const friendData = uSnap.val();
                const chatId = getChatId(currentUser.uid, friendUid);

                const item = document.createElement('div');
                item.className = 'list-item';
                item.id = `contact-item-${friendUid}`;

                item.innerHTML = `
                    <img src="${friendData.dpUrl}" class="avatar">
                    <div class="list-details">
                        <div class="list-title">
                            <span>${friendData.name}</span>
                            <span class="status-dot offline" id="dot-${friendUid}"></span>
                        </div>
                        <div class="list-subtitle" id="last-msg-${friendUid}">Tap to start chat</div>
                    </div>
                    <div id="unread-${chatId}" class="badge" style="display:none; position:relative; right:0;">0</div>
                `;

                item.addEventListener('click', () => openChatView(friendData));
                container.appendChild(item);

                // Listen to status
                onValue(ref(db, `status/${friendUid}`), (sSnap) => {
                    const st = sSnap.val();
                    const dot = document.getElementById(`dot-${friendUid}`);
                    if (dot && st) {
                        dot.className = `status-dot ${st.state === 'online' ? 'online' : 'offline'}`;
                    }
                });

                // Listen to Unread Count
                onValue(ref(db, `unreadCounts/${currentUser.uid}/${chatId}`), (uSnap) => {
                    const count = uSnap.val() || 0;
                    const badge = document.getElementById(`unread-${chatId}`);
                    if (badge) {
                        badge.textContent = count;
                        badge.style.display = count > 0 ? 'inline-block' : 'none';
                    }
                });
            }
        });
    }

    // --- Active Chat System ---
    async function openChatView(friendData) {
        activeChatUserId = friendData.uid;
        activeChatId = getChatId(currentUser.uid, friendData.uid);

        document.getElementById('chat-header-name').textContent = friendData.name;
        document.getElementById('chat-header-dp').src = friendData.dpUrl;
        document.getElementById('chat-view').classList.add('active');

        // Reset Unread Count
        await set(ref(db, `unreadCounts/${currentUser.uid}/${activeChatId}`), 0);

        // Friend Presence in Chat Header
        onValue(ref(db, `status/${friendData.uid}`), (sSnap) => {
            const st = sSnap.val();
            document.getElementById('chat-header-status').textContent = 
                (st && st.state === 'online') ? 'Online' : 'Offline';
        });

        // Listen for Typing Indicator
        onValue(ref(db, `typing/${activeChatId}/${activeChatUserId}`), (tSnap) => {
            const isTyping = tSnap.val();
            document.getElementById('typing-indicator').textContent = isTyping ? `${friendData.name} is typing...` : '';
        });

        loadMessages();
    }

    document.getElementById('close-chat-btn').addEventListener('click', () => {
        document.getElementById('chat-view').classList.remove('active');
        activeChatUserId = null;
        activeChatId = null;
    });

    // Clear Chat Logic
    document.getElementById('clear-chat-btn').addEventListener('click', async () => {
        if (!activeChatId) return;
        if (confirm("Clear all messages in this chat?")) {
            await set(ref(db, `userChats/${currentUser.uid}/${activeChatId}/clearedAt`), serverTimestamp());
            loadMessages();
        }
    });

    // Load Messages with Cleared Timestamp Filter
    async function loadMessages() {
        const messagesContainer = document.getElementById('chat-messages');
        messagesContainer.innerHTML = '';

        const clearedSnap = await get(ref(db, `userChats/${currentUser.uid}/${activeChatId}/clearedAt`));
        const clearedAt = clearedSnap.val() || 0;

        onValue(ref(db, `messages/${activeChatId}`), (mSnap) => {
            messagesContainer.innerHTML = '';
            const msgs = mSnap.val();

            if (msgs) {
                Object.values(msgs).forEach(m => {
                    if (m.timestamp > clearedAt) {
                        const b = document.createElement('div');
                        b.className = `message-bubble ${m.sender === currentUser.uid ? 'me' : 'other'}`;
                        const timeStr = m.timestamp ? new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
                        b.innerHTML = `<div>${m.text}</div><div class="message-time">${timeStr}</div>`;
                        messagesContainer.appendChild(b);
                    }
                });
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
        });
    }

    // Message Input & Typing Handler
    const msgInput = document.getElementById('message-input');
    msgInput.addEventListener('input', () => {
        if (!activeChatId) return;
        set(ref(db, `typing/${activeChatId}/${currentUser.uid}`), true);

        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
            set(ref(db, `typing/${activeChatId}/${currentUser.uid}`), false);
        }, 3000);
    });

    async function sendMessage() {
        const text = msgInput.value.trim();
        if (!text || !activeChatId) return;

        msgInput.value = '';
        set(ref(db, `typing/${activeChatId}/${currentUser.uid}`), false);

        const msgData = {
            sender: currentUser.uid,
            text: text,
            timestamp: serverTimestamp()
        };

        await push(ref(db, `messages/${activeChatId}`), msgData);

        // Increment Unread Count for Receiver
        const unreadRef = ref(db, `unreadCounts/${activeChatUserId}/${activeChatId}`);
        const snap = await get(unreadRef);
        const curr = snap.val() || 0;
        await set(unreadRef, curr + 1);
    }

    document.getElementById('send-btn').addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    // --- WebRTC Audio & Video Calling ---
    document.getElementById('voice-call-btn').addEventListener('click', () => initiateCall('voice'));
    document.getElementById('video-call-btn').addEventListener('click', () => initiateCall('video'));

    async function initiateCall(type) {
        callType = type;
        isCaller = true;
        currentCallId = getChatId(currentUser.uid, activeChatUserId);

        setupCallUI(type, activeChatUserId);
        showModal('call-screen');

        localStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: type === 'video'
        });

        document.getElementById('localVideo').srcObject = localStream;

        pc = new RTCPeerConnection(rtcConfig);
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

        pc.ontrack = (event) => {
            document.getElementById('remoteVideo').srcObject = event.streams[0];
        };

        const callRef = ref(db, `calls/${currentCallId}`);
        const candidatesRef = child(callRef, 'callerCandidates');

        pc.onicecandidate = (event) => {
            if (event.candidate) {
                push(candidatesRef, event.candidate.toJSON());
            }
        };

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        await set(callRef, {
            type: callType,
            caller: currentUser.uid,
            receiver: activeChatUserId,
            offer: { type: offer.type, sdp: offer.sdp },
            status: 'calling'
        });

        // Listen for Answer
        onValue(child(callRef, 'answer'), async (snap) => {
            const answer = snap.val();
            if (answer && pc && !pc.currentRemoteDescription) {
                await pc.setRemoteDescription(new RTCSessionDescription(answer));
                callStartTime = Date.now();
                document.getElementById('call-status').textContent = 'Connected';
            }
        });

        // Listen for Callee Candidates
        onValue(child(callRef, 'calleeCandidates'), (snap) => {
            snap.forEach((childSnap) => {
                const candidate = new RTCIceCandidate(childSnap.val());
                pc.addIceCandidate(candidate);
            });
        });

        // Listen for Rejection/End
        onValue(child(callRef, 'status'), (snap) => {
            if (snap.val() === 'ended' || snap.val() === 'rejected') {
                cleanUpCall();
            }
        });
    }

    // Callee Listener for Incoming Calls
    function listenForCallsIncoming() {
        onValue(ref(db, 'calls'), async (snap) => {
            const calls = snap.val();
            if (!calls) return;

            Object.keys(calls).forEach(async (cId) => {
                const call = calls[cId];
                if (call.receiver === currentUser.uid && call.status === 'calling') {
                    currentCallId = cId;
                    callType = call.type;

                    const callerSnap = await get(ref(db, `users/${call.caller}`));
                    const callerData = callerSnap.val();

                    document.getElementById('incoming-caller-name').textContent = callerData.name;
                    document.getElementById('incoming-caller-dp').src = callerData.dpUrl;
                    document.getElementById('incoming-call-type').textContent = `Incoming ${call.type.toUpperCase()} call...`;

                    startRingtone();
                    showModal('incoming-call-modal');
                }
            });
        });
    }

    document.getElementById('accept-call-btn').addEventListener('click', async () => {
        stopRingtone();
        hideModal('incoming-call-modal');
        showModal('call-screen');

        const callSnap = await get(ref(db, `calls/${currentCallId}`));
        const call = callSnap.val();

        setupCallUI(call.type, call.caller);

        localStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: call.type === 'video'
        });

        document.getElementById('localVideo').srcObject = localStream;

        pc = new RTCPeerConnection(rtcConfig);
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

        pc.ontrack = (event) => {
            document.getElementById('remoteVideo').srcObject = event.streams[0];
        };

        const callRef = ref(db, `calls/${currentCallId}`);
        const calleeCandidatesRef = child(callRef, 'calleeCandidates');

        pc.onicecandidate = (event) => {
            if (event.candidate) {
                push(calleeCandidatesRef, event.candidate.toJSON());
            }
        };

        await pc.setRemoteDescription(new RTCSessionDescription(call.offer));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        await update(callRef, {
            answer: { type: answer.type, sdp: answer.sdp },
            status: 'connected'
        });

        callStartTime = Date.now();

        // Listen for Caller ICE Candidates
        onValue(child(callRef, 'callerCandidates'), (snap) => {
            snap.forEach((childSnap) => {
                const candidate = new RTCIceCandidate(childSnap.val());
                pc.addIceCandidate(candidate);
            });
        });

        // Listen for Call Termination
        onValue(child(callRef, 'status'), (snap) => {
            if (snap.val() === 'ended') {
                cleanUpCall();
            }
        });
    });

    document.getElementById('reject-call-btn').addEventListener('click', async () => {
        stopRingtone();
        hideModal('incoming-call-modal');
        if (currentCallId) {
            await update(ref(db, `calls/${currentCallId}`), { status: 'rejected' });
            logCall('missed', 0);
            remove(ref(db, `calls/${currentCallId}`));
        }
    });

    async function setupCallUI(type, otherUid) {
        const uSnap = await get(ref(db, `users/${otherUid}`));
        const uData = uSnap.val();

        if (type === 'video') {
            document.getElementById('video-container').style.display = 'block';
            document.getElementById('voice-call-ui').style.display = 'none';
        } else {
            document.getElementById('video-container').style.display = 'none';
            document.getElementById('voice-call-ui').style.display = 'flex';
            document.getElementById('call-user-dp').src = uData.dpUrl;
            document.getElementById('call-user-name').textContent = uData.name;
            document.getElementById('call-status').textContent = 'Ringing...';
        }
    }

    // Call Actions (Mute & End)
    document.getElementById('toggle-audio-btn').addEventListener('click', () => {
        if (localStream) {
            isMuted = !isMuted;
            localStream.getAudioTracks()[0].enabled = !isMuted;
            document.getElementById('toggle-audio-btn').style.backgroundColor = isMuted ? 'var(--danger-color)' : 'var(--container-bg)';
        }
    });

    document.getElementById('end-call-btn').addEventListener('click', async () => {
        if (currentCallId) {
            await update(ref(db, `calls/${currentCallId}`), { status: 'ended' });
            cleanUpCall();
        }
    });

    function cleanUpCall() {
        stopRingtone();
        const duration = callStartTime ? Math.round((Date.now() - callStartTime) / 1000) : 0;
        if (currentCallId) {
            logCall(duration > 0 ? callType : 'missed', duration);
            remove(ref(db, `calls/${currentCallId}`));
        }

        if (pc) { pc.close(); pc = null; }
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
        }

        hideModal('call-screen');
        hideModal('incoming-call-modal');
        callStartTime = null;
        currentCallId = null;
    }

    // --- Call Logging ---
    async function logCall(type, duration) {
        if (!currentCallId) return;
        const logData = {
            type: type,
            duration: duration,
            timestamp: serverTimestamp(),
            peer: activeChatUserId || currentUser.uid
        };
        await push(ref(db, `callLogs/${currentUser.uid}`), logData);
    }

    function listenForCallLogs() {
        onValue(ref(db, `callLogs/${currentUser.uid}`), async (snap) => {
            const container = document.getElementById('calls-list');
            container.innerHTML = '';
            const logs = snap.val();

            if (!logs) {
                container.innerHTML = '<p style="padding:16px; color:var(--secondary-text)">No call logs available.</p>';
                return;
            }

            for (let lKey of Object.keys(logs).reverse()) {
                const log = logs[lKey];
                const pSnap = await get(ref(db, `users/${log.peer}`));
                const pData = pSnap.val() || { name: 'Unknown', dpUrl: emojiToSVG('?') };

                const item = document.createElement('div');
                item.className = 'list-item';
                const timeStr = log.timestamp ? new Date(log.timestamp).toLocaleString() : '';

                item.innerHTML = `
                    <img src="${pData.dpUrl}" class="avatar">
                    <div class="list-details">
                        <div class="list-title">${pData.name}</div>
                        <div class="list-subtitle">${log.type.toUpperCase()} • ${log.duration}s • ${timeStr}</div>
                    </div>
                `;
                container.appendChild(item);
            }
        });
    }

    // Draggable Local Video Screen Implementation
    const localVideoEl = document.getElementById("localVideo");
    let isDragging = false, currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;

    localVideoEl.addEventListener("touchstart", dragStart, false);
    localVideoEl.addEventListener("touchend", dragEnd, false);
    localVideoEl.addEventListener("touchmove", drag, false);
    localVideoEl.addEventListener("mousedown", dragStart, false);
    localVideoEl.addEventListener("mouseup", dragEnd, false);
    localVideoEl.addEventListener("mousemove", drag, false);

    function dragStart(e) {
        initialX = (e.type === "touchstart" ? e.touches[0].clientX : e.clientX) - xOffset;
        initialY = (e.type === "touchstart" ? e.touches[0].clientY : e.clientY) - yOffset;
        if (e.target === localVideoEl) isDragging = true;
    }

    function dragEnd() {
        initialX = currentX;
        initialY = currentY;
        isDragging = false;
    }

    function drag(e) {
        if (isDragging) {
            e.preventDefault();
            currentX = (e.type === "touchmove" ? e.touches[0].clientX : e.clientX) - initialX;
            currentY = (e.type === "touchmove" ? e.touches[0].clientY : e.clientY) - initialY;
            xOffset = currentX; yOffset = currentY;
            localVideoEl.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
        }
    }
</script>
